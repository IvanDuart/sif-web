<div class="p-4" *transloco="let t">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">{{ t('templates.title') }}</h1>
    <div class="flex gap-2">
      <p-button
        *appIfPermission="'MANAGE_TEMPLATE'"
        [label]="t('templates.upload_ocr')"
        icon="fa-solid fa-file-arrow-up"
        size="small"
        severity="secondary"
        (onClick)="uploadTemplate()">
      </p-button>
      <p-button
        *appIfPermission="'MANAGE_TEMPLATE'"
        [label]="t('templates.create')"
        icon="fa-solid fa-plus"
        size="small"
        (onClick)="createTemplate()">
      </p-button>
    </div>
  </div>

  <p-card>
    <p-table
      [value]="templates()"
      [loading]="loading()"
      [rows]="25"
      [paginator]="true"
      [totalRecords]="totalRecords()"
      [lazy]="true"
      [rowHover]="true"
      responsiveLayout="scroll"
      styleClass="p-datatable-sm"
      [rowsPerPageOptions]="[25, 50, 100]"
      [showCurrentPageReport]="true"
      [currentPageReportTemplate]="t('common.pagination_report', { first: '{first}', last: '{last}', totalRecords: '{totalRecords}' })"
      (onLazyLoad)="onPage($event)">
      <ng-template pTemplate="header">
        <tr>
          <th scope="col">{{ t('diets.name') }}</th>
          <th scope="col">{{ t('templates.description') }}</th>
          <th scope="col" style="width: 7rem; text-align: center;">{{ t('common.actions') }}</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-template>
        <tr>
          <td class="font-medium">{{ template.name }}</td>
          <td class="text-surface-500 text-sm">{{ template.description }}</td>
          <td style="text-align: center;">
            <div class="row-actions">
              <p-button
                icon="fa-solid fa-eye"
                [text]="true"
                [rounded]="true"
                severity="secondary"
                (onClick)="viewTemplate(template)"
                [title]="t('templates.view_detail')">
              </p-button>
              <p-button
                *appIfPermission="'INSTANTIATE_TEMPLATE'"
                icon="fa-solid fa-user-plus"
                [text]="true"
                [rounded]="true"
                severity="secondary"
                (onClick)="instantiateTemplate(template)"
                [title]="t('templates.assign')">
              </p-button>
              <p-button
                *appIfPermission="'MANAGE_TEMPLATE'"
                icon="fa-solid fa-trash"
                [text]="true"
                [rounded]="true"
                severity="danger"
                (onClick)="deleteTemplate(template)"
                [title]="t('common.delete')">
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3" class="table-empty-cell">
            <app-empty-state
              icon="fa-solid fa-clipboard-list"
              [title]="t('templates.empty_title')"
              [description]="t('templates.empty')"
              [actionLabel]="t('templates.create')"
              (action)="createTemplate()">
            </app-empty-state>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
