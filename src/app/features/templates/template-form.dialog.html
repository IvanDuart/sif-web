<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 mt-2">
  <tui-textfield class="w-full">
    <label tuiLabel for="name">Nombre de la Plantilla</label>
    <input id="name" formControlName="name" />
  </tui-textfield>

  <tui-textfield class="w-full">
    <label tuiLabel for="description">Descripción</label>
    <textarea id="description" formControlName="description" tuiTextarea rows="4"></textarea>
  </tui-textfield>

  <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
    <button type="button" class="btn-secondary" (click)="cancel()">Cancelar</button>
    <button type="submit" class="btn-primary" [disabled]="form.invalid">Guardar Plantilla</button>
  </div>
</form>
