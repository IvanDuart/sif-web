<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 mt-2">
  <div class="field flex flex-col gap-1.5">
    <label for="name" class="text-sm font-medium text-surface-700 dark:text-surface-300">Nombre de la Plantilla</label>
    <input id="name" formControlName="name" class="form-input" placeholder="Ej: Dieta Cetogénica" />
  </div>

  <div class="field flex flex-col gap-1.5">
    <label for="description" class="text-sm font-medium text-surface-700 dark:text-surface-300">Descripción</label>
    <textarea id="description" formControlName="description" class="form-input" rows="4" placeholder="Descripción"></textarea>
  </div>

  <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
    <button type="button" class="btn-secondary" (click)="cancel()">Cancelar</button>
    <button type="submit" class="btn-primary" [disabled]="form.invalid">Guardar Plantilla</button>
  </div>
</form>
