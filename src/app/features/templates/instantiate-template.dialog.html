<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 mt-2">
  <div class="bg-primary-50 dark:bg-primary-900/20 p-4 rounded-lg text-sm mb-2">
    Creando menú a partir de: <strong>{{ template?.name }}</strong>
  </div>

  <div class="field flex flex-col gap-1.5">
    <label for="appUserId" class="text-sm font-medium text-surface-700 dark:text-surface-300">Paciente Destino</label>
    <select id="appUserId" formControlName="appUserId" required class="form-input">
      <option value="" disabled>Seleccionar Paciente</option>
      @for (u of users(); track u.id) {
        <option [value]="u.id">{{ u.fullName }}</option>
      }
    </select>
  </div>

  <div class="field flex flex-col gap-1.5">
    <label for="name" class="text-sm font-medium text-surface-700 dark:text-surface-300">Nombre del nuevo menú</label>
    <input id="name" formControlName="name" class="form-input" />
  </div>

  <div class="flex items-center gap-2 mt-2">
    <input type="checkbox" id="isActive" formControlName="isActive" class="h-4 w-4 rounded border-surface-300 text-primary-500 focus:ring-primary-300" />
    <label for="isActive" class="text-sm font-medium text-surface-700 dark:text-surface-300">Establecer como menú activo</label>
  </div>

  <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
    <button type="button" class="btn-secondary" (click)="cancel()">Cancelar</button>
    <button type="submit" class="btn-primary" [disabled]="form.invalid">Asignar al Paciente</button>
  </div>
</form>
