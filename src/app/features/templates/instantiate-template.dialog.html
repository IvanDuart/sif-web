<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 mt-2">
      <div class="bg-primary-50 dark:bg-primary-900/20 p-4 rounded-lg text-sm mb-2">
        Creando menú a partir de: <strong>{{ template?.name }}</strong>
      </div>

      <div class="field flex flex-col gap-1.5">
        <label for="appUserId" class="text-sm font-medium text-surface-700 dark:text-surface-300">Paciente Destino</label>
        <select id="appUserId" formControlName="appUserId" required class="w-full rounded-lg border border-surface-300 bg-white px-3 py-2.5 text-sm text-surface-900 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 dark:bg-surface-800 dark:border-surface-600 dark:text-surface-100 dark:focus:ring-primary-800 outline-none transition-all">
          <option value="" disabled>Seleccionar Paciente</option>
          @for (u of users(); track u.id) {
            <option [value]="u.id">{{ u.fullName }}</option>
          }
        </select>
      </div>

      <tui-textfield>
        <label tuiLabel>Nombre del nuevo menú</label>
        <input tuiTextfield formControlName="name" />
      </tui-textfield>

      <div class="flex items-center gap-2 mt-2">
        <input type="checkbox" id="isActive" formControlName="isActive" class="h-4 w-4 rounded border-surface-300 text-emerald-600 focus:ring-emerald-500" />
        <label for="isActive" class="text-sm font-medium text-surface-700 dark:text-surface-300">Establecer como menú activo</label>
      </div>

      <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
        <button type="button" class="inline-flex items-center justify-center gap-2 rounded-lg border border-surface-300 bg-white px-4 py-2 text-sm font-medium text-surface-700 hover:bg-surface-50 transition-colors" (click)="cancel()">Cancelar</button>
        <button type="submit" class="inline-flex items-center justify-center gap-2 rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700 transition-colors disabled:opacity-50 disabled:pointer-events-none" [disabled]="form.invalid">Asignar al Paciente</button>
      </div>
    </form>
