<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 mt-2">
  <div class="bg-primary-50 dark:bg-primary-900/20 p-4 rounded-lg text-sm mb-2">
    {{ 'templates.creating_from' | transloco }} <strong>{{ template?.name }}</strong>
  </div>

  <tui-textfield class="w-full" tuiChevron [stringify]="patientStringify">
    <label tuiLabel for="appUserId">{{ 'menu_history.target_patient' | transloco }}</label>
    <input id="appUserId" formControlName="appUserId" tuiComboBox />
    <tui-data-list-wrapper *tuiDropdown [items]="users() | tuiFilterByInput"></tui-data-list-wrapper>
  </tui-textfield>

  <tui-textfield class="w-full">
    <label tuiLabel for="name">{{ 'menu_history.new_menu_name' | transloco }}</label>
    <input id="name" formControlName="name" tuiInput />
  </tui-textfield>

  <div class="flex items-center gap-2 mt-2">
    <input type="checkbox"
           tuiCheckbox
           id="isActive"
           formControlName="isActive" />
    <label for="isActive" class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ 'menu_history.set_active' | transloco }}</label>
  </div>

  <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
    <button type="button" tuiButton appearance="secondary" size="m" (click)="cancel()">{{ 'common.cancel' | transloco }}</button>
    <button type="submit" tuiButton size="m" [disabled]="form.invalid">{{ 'menu_history.assign_to_patient' | transloco }}</button>
  </div>
</form>
