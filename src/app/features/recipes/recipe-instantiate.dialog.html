<div class="flex flex-col gap-4" *transloco="let t">
  <p class="text-[13px] text-surface-500 dark:text-surface-400">
    {{ t('recipes.instantiate_hint', { name: context.data.recipe.name }) }}
  </p>

  <label class="flex flex-col gap-1.5">
    <span class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ t('recipes.select_menu') }}</span>
    <select
      class="w-full rounded-md border border-line bg-surface-0 px-3 py-2 text-sm outline-none focus:border-primary-400 dark:bg-surface-900"
      [ngModel]="selectedMenuId"
      (ngModelChange)="onMenuChange($event)"
      [disabled]="loadingMenus()"
    >
      <option value="">{{ loadingMenus() ? t('common.loading') : t('common.select_option') }}</option>
      @for (menu of menus(); track menu.id) {
        <option [value]="menu.id">{{ menu.name }}</option>
      }
    </select>
  </label>

  <label class="flex flex-col gap-1.5">
    <span class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ t('recipes.select_meal') }}</span>
    <select
      class="w-full rounded-md border border-line bg-surface-0 px-3 py-2 text-sm outline-none focus:border-primary-400 dark:bg-surface-900"
      [(ngModel)]="selectedMealId"
      [disabled]="!selectedMenuId || loadingMeals()"
    >
      <option value="">
        {{ loadingMeals() ? t('common.loading') : meals().length === 0 ? t('recipes.no_meals') : t('common.select_option') }}
      </option>
      @for (meal of meals(); track meal.id) {
        <option [value]="meal.id">{{ mealLabel(meal) }}</option>
      }
    </select>
  </label>

  <div class="mt-3 flex justify-end gap-2 border-t border-line pt-4">
    <button type="button" tuiButton appearance="secondary" size="m" (click)="cancel()">
      {{ t('common.cancel') }}
    </button>
    <button
      type="button"
      tuiButton
      appearance="primary"
      size="m"
      [disabled]="saving() || !selectedMealId"
      (click)="save()"
    >
      @if (saving()) {
        <i class="fa-solid fa-spinner fa-spin mr-1" aria-hidden="true"></i>
      }
      {{ t('recipes.instantiate') }}
    </button>
  </div>
</div>
