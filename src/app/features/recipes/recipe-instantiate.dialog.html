<div class="flex flex-col gap-4" *transloco="let t">
  <p class="text-[13px] text-surface-500 dark:text-surface-400">
    {{ t('recipes.instantiate_hint', { name: context.data.recipe.name }) }}
  </p>

  <tui-textfield class="w-full" tuiChevron [stringify]="targetTypeStringify">
    <label tuiLabel for="targetTypeSelect">{{ t('recipes.target_type') }}</label>
    <input id="targetTypeSelect" tuiSelect [formControl]="targetTypeControl" />
    <tui-data-list-wrapper *tuiDropdown [items]="targetTypeValues()"></tui-data-list-wrapper>
  </tui-textfield>

  <tui-textfield class="w-full" tuiChevron [stringify]="sourceStringify">
    <label tuiLabel for="sourceSelect">
      {{ targetType() === 'menu' ? t('recipes.select_menu') : t('recipes.select_template') }}
    </label>
    <input
      id="sourceSelect"
      tuiSelect
      [formControl]="sourceControl"
      [placeholder]="loadingSources() ? t('common.loading') : t('common.select_option')"
    />
    <tui-data-list-wrapper *tuiDropdown [items]="sourceValues()"></tui-data-list-wrapper>
  </tui-textfield>

  <tui-textfield class="w-full" tuiChevron [stringify]="mealStringify">
    <label tuiLabel for="mealSelect">{{ t('recipes.select_meal') }}</label>
    <input
      id="mealSelect"
      tuiSelect
      [formControl]="mealControl"
      [placeholder]="
        loadingMeals()
          ? t('common.loading')
          : !sourceControl.value
            ? t('common.select_option')
            : meals().length === 0
              ? t('recipes.no_meals')
              : t('common.select_option')
      "
    />
    <tui-data-list-wrapper *tuiDropdown [items]="mealValues()"></tui-data-list-wrapper>
  </tui-textfield>

  <tui-textfield class="w-full">
    <label tuiLabel for="servingsInput">{{ t('recipes.servings_persons') }}</label>
    <input id="servingsInput" tuiInput type="number" min="1" step="1" [formControl]="servingsControl" />
  </tui-textfield>

  <div class="mt-3 flex justify-end gap-2 border-t border-line pt-4">
    <button type="button" tuiButton appearance="secondary" size="m" (click)="cancel()">
      {{ t('common.cancel') }}
    </button>
    <button
      type="button"
      tuiButton
      appearance="primary"
      size="m"
      [disabled]="saving() || !mealControl.value || servingsControl.invalid"
      data-mascot-submit="recipe-instantiate"
      (click)="save()"
    >
      @if (saving()) {
        <i class="fa-solid fa-spinner fa-spin mr-1" aria-hidden="true"></i>
      }
      {{ t('recipes.instantiate') }}
    </button>
  </div>
</div>
