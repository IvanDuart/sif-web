<div class="flex flex-col gap-4 mt-2 w-full" *transloco="let t">
  <tui-textfield class="w-full" iconStart="@tui.search">
    <input
      tuiInput
      type="search"
      [formControl]="searchControl"
      [placeholder]="t('chat.search_patient')"
      [attr.aria-label]="t('chat.search_patient')"
    />
  </tui-textfield>

  @if (loading()) {
    <p class="py-6 text-center text-[13px] text-surface-400">{{ t('common.loading') }}</p>
  } @else if (results().length === 0) {
    <p class="py-6 text-center text-[13px] text-surface-400">{{ t('chat.no_patients') }}</p>
  } @else {
    <ul class="flex max-h-80 flex-col gap-1 overflow-y-auto">
      @for (user of results(); track user.id) {
        <li>
          <button
            type="button"
            class="flex w-full items-center gap-3 rounded-md px-3 py-2.5 text-left transition-colors hover:bg-surface-100 focus-visible:outline-2 focus-visible:outline-primary-500 dark:hover:bg-surface-700"
            [disabled]="!!creatingId()"
            (click)="open(user)"
            [attr.aria-label]="openLabel(user)"
          >
            <span tuiAvatar size="m" [round]="true">{{ initials(user) }}</span>
            <span class="min-w-0 flex-1">
              <span class="block truncate text-sm font-medium text-surface-900 dark:text-surface-0">
                {{ user.firstName }} {{ user.lastName }}
              </span>
              @if (user.email) {
                <span class="block truncate text-xs text-surface-400">{{ user.email }}</span>
              }
            </span>
            @if (creatingId() === user.id) {
              <i class="fa-solid fa-spinner fa-spin text-surface-400" aria-hidden="true"></i>
            } @else {
              <i class="fa-solid fa-comment-dots text-surface-400" aria-hidden="true"></i>
            }
          </button>
        </li>
      }
    </ul>
  }

  <div class="flex justify-end border-t border-line pt-4">
    <button type="button" tuiButton appearance="secondary" size="m" (click)="cancel()">
      {{ t('common.cancel') }}
    </button>
  </div>
</div>
