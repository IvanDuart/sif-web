<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 mt-2" *transloco="let t">
  <div class="grid grid-cols-2 gap-4">
    <div class="field flex flex-col gap-1.5">
      <label for="firstName" class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ t('users.first_name') }}</label>
      <input id="firstName" formControlName="firstName" class="form-input" />
    </div>
    <div class="field flex flex-col gap-1.5">
      <label for="lastName" class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ t('users.last_name') }}</label>
      <input id="lastName" formControlName="lastName" class="form-input" />
    </div>
  </div>

  <div class="field flex flex-col gap-1.5">
    <label for="email" class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ t('users.email') }}</label>
    <input id="email" type="email" formControlName="email" class="form-input" />
  </div>

  @if (lockedUserType !== 'PATIENT') {
    <div class="field flex flex-col gap-1.5">
      <label for="roleCode" class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ t('users.role') }}</label>
      <select id="roleCode" formControlName="roleCode" class="form-input">
        <option value="" disabled>{{ t('common.select_option') }}</option>
        @for (role of roles(); track role.value) {
          <option [value]="role.value">{{ role.label }}</option>
        }
      </select>
    </div>
  }

  @if (showClinicalFields()) {
    <div class="grid grid-cols-3 gap-4">
      <div class="field flex flex-col gap-1.5">
        <label for="birthDate" class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ t('users.birth_date') }}</label>
        <input id="birthDate" type="date" formControlName="birthDate" class="form-input" />
      </div>
      <div class="field flex flex-col gap-1.5">
        <label for="heightCm" class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ t('users.height_cm') }}</label>
        <input id="heightCm" type="number" formControlName="heightCm" min="50" max="250" step="0.1" class="form-input" />
      </div>
      <div class="field flex flex-col gap-1.5">
        <label for="gender" class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ t('users.gender') }}</label>
        <select id="gender" formControlName="gender" class="form-input">
          <option value="" disabled>{{ t('common.select_option') }}</option>
          @for (opt of genderOptions; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </div>
    </div>
  }

  <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
    <button type="button" tuiButton appearance="secondary" size="m" (click)="cancel()">{{ t('common.cancel') }}</button>
    <button type="submit" tuiButton size="m" [disabled]="form.invalid || saving()">
      @if (saving()) {
        <i class="fa-solid fa-spinner fa-spin animate-spin mr-1"></i>
      }
      {{ t('users.invite_user') }}
    </button>
  </div>
</form>
