<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 mt-2" *transloco="let t">
      <div class="field flex flex-col gap-2">
        <label for="email" class="font-medium">{{ t('users.email') }}</label>
        <input id="email" type="email" pInputText formControlName="email" class="w-full" placeholder="ejemplo@correo.com" autofocus />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="field flex flex-col gap-2">
          <label for="firstName" class="font-medium">{{ t('users.first_name') }}</label>
          <input id="firstName" pInputText formControlName="firstName" class="w-full" />
        </div>
        <div class="field flex flex-col gap-2">
          <label for="lastName" class="font-medium">{{ t('users.last_name') }}</label>
          <input id="lastName" pInputText formControlName="lastName" class="w-full" />
        </div>
      </div>

      <div class="field flex flex-col gap-2">
        <label for="roleCode" class="font-medium">{{ t('users.role') }}</label>
        <p-select 
          id="roleCode" 
          formControlName="roleCode" 
          [options]="roles()" 
          optionLabel="label" 
          optionValue="value" 
          placeholder="Seleccionar Rol" 
          class="w-full" 
          appendTo="body">
        </p-select>
      </div>

      @if (showClinicalFields()) {
      <div class="grid grid-cols-2 gap-4">
        <div class="field flex flex-col gap-2">
          <label for="birthDate" class="font-medium text-sm">{{ t('users.birth_date') }}</label>
          <p-datepicker
            id="birthDate"
            formControlName="birthDate"
            dateFormat="yy-mm-dd"
            [showIcon]="true"
            [iconDisplay]="'input'"
            class="w-full"
            appendTo="body" />
        </div>
        <div class="field flex flex-col gap-2">
          <label for="heightCm" class="font-medium text-sm">{{ t('users.height_cm') }}</label>
          <p-inputnumber
            id="heightCm"
            formControlName="heightCm"
            [min]="50"
            [max]="250"
            [maxFractionDigits]="1"
            suffix=" cm"
            class="w-full" />
        </div>
        <div class="field flex flex-col gap-2">
          <label for="gender" class="font-medium text-sm">{{ t('users.gender') }}</label>
          <p-select
            id="gender"
            formControlName="gender"
            [options]="genderOptions"
            optionLabel="label"
            optionValue="value"
            placeholder="Seleccionar..."
            class="w-full"
            [showClear]="true"
            appendTo="body">
          </p-select>
        </div>
      </div>
      }

      <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
        <p-button [label]="t('common.cancel')" severity="secondary" [text]="true" (onClick)="ref.close()"></p-button>
        <p-button label="Invitar Usuario" type="submit" [disabled]="form.invalid" [loading]="saving()"></p-button>
      </div>
    </form>
