<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 mt-2">
  <tui-textfield class="w-full">
    <label tuiLabel for="templateId">{{ 'menu_history.template_label' | transloco }}</label>
    <select id="templateId" formControlName="templateId" (change)="onTemplateChange($event)" tuiInput>
      <option value="" disabled>{{ 'menu_history.select_template' | transloco }}</option>
      @for (t of templates(); track t.id) {
        <option [value]="t.id">{{ t.name }}</option>
      }
    </select>
  </tui-textfield>

  <tui-textfield class="w-full">
    <label tuiLabel for="name">{{ 'menu_history.new_menu_name' | transloco }}</label>
    <input type="text" formControlName="name" id="name" tuiInput [placeholder]="'menu_history.menu_name_placeholder' | transloco" />
  </tui-textfield>

  <div class="flex items-center gap-3 py-1 mt-1">
    <input type="checkbox" id="isActive" formControlName="isActive" tuiSwitch />
    <label for="isActive" class="text-sm font-medium text-surface-700 dark:text-surface-300 cursor-pointer">
      {{ 'menu_history.set_active' | transloco }}
    </label>
  </div>

  <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
    <button type="button" tuiButton appearance="secondary" size="m" (click)="ref.close()">{{ 'common.cancel' | transloco }}</button>
    <button type="submit" tuiButton size="m" [disabled]="form.invalid" [class.loading]="saving()">{{ 'menu_history.assign_to_patient' | transloco }}</button>
  </div>
</form>
