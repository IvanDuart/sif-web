<form [formGroup]="form" (ngSubmit)="submit()" *transloco="let t">
  <p-stepper [value]="activeStep" [linear]="true" class="basis-[50rem]">
    <p-step-list>
      <p-step [value]="1">{{ t('measurements.step_composition') }}</p-step>
      <p-step [value]="2">{{ t('measurements.step_circumferences') }}</p-step>
      <p-step [value]="3">{{ t('measurements.step_details') }}</p-step>
    </p-step-list>

    <p-step-panels>
      <p-step-panel [value]="1">
        <ng-template pTemplate="content">
          <div class="flex flex-col gap-4 pt-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="field flex flex-col gap-2">
                <label for="weightKg" class="font-medium text-sm">{{ t('measurements.weight') }}</label>
                <p-inputnumber
                  id="weightKg"
                  formControlName="weightKg"
                  [min]="0"
                  [max]="999.99"
                  [maxFractionDigits]="2"
                  suffix=" kg"
                  class="w-full" />
              </div>
              <div class="field flex flex-col gap-2">
                <label for="bodyFatPct" class="font-medium text-sm">{{ t('measurements.body_fat') }}</label>
                <p-inputnumber
                  id="bodyFatPct"
                  formControlName="bodyFatPct"
                  [min]="0"
                  [max]="99.9"
                  [maxFractionDigits]="1"
                  suffix=" %"
                  class="w-full" />
              </div>
              <div class="field flex flex-col gap-2">
                <label for="muscleMassKg" class="font-medium text-sm">{{ t('measurements.muscle_mass') }}</label>
                <p-inputnumber
                  id="muscleMassKg"
                  formControlName="muscleMassKg"
                  [min]="0"
                  [max]="999.99"
                  [maxFractionDigits]="2"
                  suffix=" kg"
                  class="w-full" />
              </div>
              <div class="field flex flex-col gap-2">
                <label for="bodyWaterPct" class="font-medium text-sm">{{ t('measurements.body_water') }}</label>
                <p-inputnumber
                  id="bodyWaterPct"
                  formControlName="bodyWaterPct"
                  [min]="0"
                  [max]="99.9"
                  [maxFractionDigits]="1"
                  suffix=" %"
                  class="w-full" />
              </div>
            </div>
            <div class="flex justify-end gap-2 pt-4">
              <p-button [label]="t('common.cancel')" severity="secondary" [text]="true" (onClick)="ref.close()"></p-button>
              <p-button [label]="'Siguiente'" icon="fa-solid fa-arrow-right" iconPos="right" (onClick)="nextStep()"></p-button>
            </div>
          </div>
        </ng-template>
      </p-step-panel>

      <p-step-panel [value]="2">
        <ng-template pTemplate="content">
          <div class="flex flex-col gap-4 pt-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="field flex flex-col gap-2">
                <label for="waistCm" class="font-medium text-sm">{{ t('measurements.waist') }}</label>
                <p-inputnumber
                  id="waistCm"
                  formControlName="waistCm"
                  [min]="0"
                  [max]="999.9"
                  [maxFractionDigits]="1"
                  suffix=" cm"
                  class="w-full" />
              </div>
              <div class="field flex flex-col gap-2">
                <label for="chestCm" class="font-medium text-sm">{{ t('measurements.chest') }}</label>
                <p-inputnumber
                  id="chestCm"
                  formControlName="chestCm"
                  [min]="0"
                  [max]="999.9"
                  [maxFractionDigits]="1"
                  suffix=" cm"
                  class="w-full" />
              </div>
              <div class="field flex flex-col gap-2">
                <label for="hipsCm" class="font-medium text-sm">{{ t('measurements.hips') }}</label>
                <p-inputnumber
                  id="hipsCm"
                  formControlName="hipsCm"
                  [min]="0"
                  [max]="999.9"
                  [maxFractionDigits]="1"
                  suffix=" cm"
                  class="w-full" />
              </div>
              <div class="field flex flex-col gap-2">
                <label for="contourCm" class="font-medium text-sm">{{ t('measurements.contour') }}</label>
                <p-inputnumber
                  id="contourCm"
                  formControlName="contourCm"
                  [min]="0"
                  [max]="999.9"
                  [maxFractionDigits]="1"
                  suffix=" cm"
                  class="w-full" />
              </div>
              <div class="field flex flex-col gap-2">
                <label for="armCm" class="font-medium text-sm">{{ t('measurements.arm') }}</label>
                <p-inputnumber
                  id="armCm"
                  formControlName="armCm"
                  [min]="0"
                  [max]="999.9"
                  [maxFractionDigits]="1"
                  suffix=" cm"
                  class="w-full" />
              </div>
            </div>
            <div class="flex justify-between gap-2 pt-4">
              <p-button [label]="'Anterior'" icon="fa-solid fa-arrow-left" severity="secondary" (onClick)="prevStep()"></p-button>
              <p-button [label]="'Siguiente'" icon="fa-solid fa-arrow-right" iconPos="right" (onClick)="nextStep()"></p-button>
            </div>
          </div>
        </ng-template>
      </p-step-panel>

      <p-step-panel [value]="3">
        <ng-template pTemplate="content">
          <div class="flex flex-col gap-4 pt-4">
            <div class="field flex flex-col gap-2">
              <label for="measuredAt" class="font-medium text-sm">{{ t('measurements.measured_at') }}</label>
              <p-datepicker
                id="measuredAt"
                formControlName="measuredAt"
                dateFormat="yy-mm-dd"
                [showIcon]="true"
                [showTime]="true"
                [iconDisplay]="'input'"
                [maxDate]="today"
                class="w-full"
                appendTo="body" />
            </div>
            <div class="field flex flex-col gap-2">
              <label for="notes" class="font-medium text-sm">{{ t('measurements.notes') }}</label>
              <textarea
                id="notes"
                pInputTextarea
                formControlName="notes"
                rows="3"
                class="w-full"
                [placeholder]="t('measurements.notes_placeholder')"></textarea>
            </div>
            <div class="flex justify-between gap-2 pt-4 border-t border-surface-200 dark:border-surface-700">
              <p-button [label]="'Anterior'" icon="fa-solid fa-arrow-left" severity="secondary" (onClick)="prevStep()"></p-button>
              <p-button [label]="t('measurements.register')" type="submit" icon="fa-solid fa-floppy-disk" [loading]="saving"></p-button>
            </div>
          </div>
        </ng-template>
      </p-step-panel>
    </p-step-panels>
  </p-stepper>
</form>
