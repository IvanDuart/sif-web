<form [formGroup]="form" (ngSubmit)="submit()" *transloco="let t">
  <!-- Step indicator -->
  <div class="flex items-center gap-2 mb-6">
    @for (step of [1, 2, 3]; track step) {
      <button type="button" (click)="activeStep.set(step)" [class.bg-primary-500]="activeStep() >= step" [class.text-white]="activeStep() >= step" [class.bg-surface-200]="activeStep() < step" class="w-8 h-8 rounded-full text-xs font-bold flex items-center justify-center transition-colors">{{ step }}</button>
      @if (step < 3) {
        <div class="flex-1 h-0.5 rounded" [class.bg-primary-500]="activeStep() > step" [class.bg-surface-200]="activeStep() <= step"></div>
      }
    }
  </div>
  <!-- Step labels -->
  <div class="flex justify-between text-xs text-surface-500 mb-4 font-medium">
    <span [class.font-semibold]="activeStep() === 1" [class.text-primary-600]="activeStep() === 1">{{ t('measurements.step_composition') }}</span>
    <span [class.font-semibold]="activeStep() === 2" [class.text-primary-600]="activeStep() === 2">{{ t('measurements.step_circumferences') }}</span>
    <span [class.font-semibold]="activeStep() === 3" [class.text-primary-600]="activeStep() === 3">{{ t('measurements.step_details') }}</span>
  </div>

  @if (activeStep() === 1) {
    <div class="flex flex-col gap-4 pt-2">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <tui-textfield class="w-full">
          <label tuiLabel>{{ t('measurements.weight') }} (kg)</label>
          <input type="number" formControlName="weightKg" tuiInput step="0.01" min="0" max="999.99" />
        </tui-textfield>

        <tui-textfield class="w-full">
          <label tuiLabel>{{ t('measurements.body_fat') }} (%)</label>
          <input type="number" formControlName="bodyFatPct" tuiInput step="0.1" min="0" max="99.9" />
        </tui-textfield>

        <tui-textfield class="w-full">
          <label tuiLabel>{{ t('measurements.muscle_mass') }} (kg)</label>
          <input type="number" formControlName="muscleMassKg" tuiInput step="0.01" min="0" max="999.99" />
        </tui-textfield>

        <tui-textfield class="w-full">
          <label tuiLabel>{{ t('measurements.body_water') }} (%)</label>
          <input type="number" formControlName="bodyWaterPct" tuiInput step="0.1" min="0" max="99.9" />
        </tui-textfield>
      </div>
      <div class="flex justify-end gap-2 pt-4 border-t border-surface-200 dark:border-surface-700 mt-4">
        <button type="button" tuiButton appearance="secondary" size="m" (click)="ref.close()">{{ t('common.cancel') }}</button>
        <button type="button" tuiButton size="m" (click)="nextStep()">{{ t('common.next') }} <i class="fa-solid fa-arrow-right ml-1"></i></button>
      </div>
    </div>
  }

  @if (activeStep() === 2) {
    <div class="flex flex-col gap-4 pt-2">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <tui-textfield class="w-full">
          <label tuiLabel>{{ t('measurements.waist') }} (cm)</label>
          <input type="number" formControlName="waistCm" tuiInput step="0.1" min="0" max="999.9" />
        </tui-textfield>

        <tui-textfield class="w-full">
          <label tuiLabel>{{ t('measurements.chest') }} (cm)</label>
          <input type="number" formControlName="chestCm" tuiInput step="0.1" min="0" max="999.9" />
        </tui-textfield>

        <tui-textfield class="w-full">
          <label tuiLabel>{{ t('measurements.hips') }} (cm)</label>
          <input type="number" formControlName="hipsCm" tuiInput step="0.1" min="0" max="999.9" />
        </tui-textfield>

        <tui-textfield class="w-full">
          <label tuiLabel>{{ t('measurements.contour') }} (cm)</label>
          <input type="number" formControlName="contourCm" tuiInput step="0.1" min="0" max="999.9" />
        </tui-textfield>

        <tui-textfield class="w-full sm:col-span-2">
          <label tuiLabel>{{ t('measurements.arm') }} (cm)</label>
          <input type="number" formControlName="armCm" tuiInput step="0.1" min="0" max="999.9" />
        </tui-textfield>
      </div>
      <div class="flex justify-between gap-2 pt-4 border-t border-surface-200 dark:border-surface-700 mt-4">
        <button type="button" tuiButton appearance="secondary" size="m" (click)="prevStep()"><i class="fa-solid fa-arrow-left mr-1"></i> {{ t('common.previous') }}</button>
        <button type="button" tuiButton size="m" (click)="nextStep()">{{ t('common.next') }} <i class="fa-solid fa-arrow-right ml-1"></i></button>
      </div>
    </div>
  }

  @if (activeStep() === 3) {
    <div class="flex flex-col gap-4 pt-2">
      <tui-textfield class="w-full">
        <label tuiLabel>{{ t('measurements.measured_at') }}</label>
        <input type="datetime-local" formControlName="measuredAt" tuiInput />
      </tui-textfield>

      <tui-textfield class="w-full">
        <label tuiLabel>{{ t('measurements.notes') }}</label>
        <textarea formControlName="notes" tuiTextarea rows="3" [placeholder]="t('measurements.notes_placeholder')"></textarea>
      </tui-textfield>

      <div class="flex justify-between gap-2 pt-4 border-t border-surface-200 dark:border-surface-700 mt-4">
        <button type="button" tuiButton appearance="secondary" size="m" (click)="prevStep()"><i class="fa-solid fa-arrow-left mr-1"></i> {{ t('common.previous') }}</button>
        <button type="submit" tuiButton size="m" [disabled]="form.invalid" [class.loading]="saving()">{{ t('measurements.register') }}</button>
      </div>
    </div>
  }
</form>
