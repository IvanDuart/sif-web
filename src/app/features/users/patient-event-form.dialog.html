<div *transloco="let t">
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 mt-2">
    <div class="flex flex-col gap-1.5">
      <label for="eventTitle" class="text-sm font-medium text-surface-700">{{ t('patient_events.title_field') }}</label>
      <input
        id="eventTitle"
        type="text"
        formControlName="title"
        class="w-full rounded-lg border border-surface-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
        [placeholder]="t('patient_events.title_field')" />
      @if (form.get('title')?.invalid && form.get('title')?.touched) {
        <small class="text-red-500">{{ t('patient_events.title_required') }}</small>
      }
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="eventDescription" class="text-sm font-medium text-surface-700">{{ t('patient_events.description') }}</label>
      <textarea
        id="eventDescription"
        formControlName="description"
        rows="3"
        class="w-full rounded-lg border border-surface-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
        [placeholder]="t('patient_events.description')">
      </textarea>
    </div>

    <tui-textfield>
      <label tuiLabel for="eventStartDate">{{ t('patient_events.start_time') }}</label>
      <input
        id="eventStartDate"
        tuiInputDate
        formControlName="startTime" />
      <tui-calendar *tuiDropdown />
      @if (form.get('startTime')?.invalid && form.get('startTime')?.touched) {
        <small class="text-red-500">{{ t('patient_events.start_time_future') }}</small>
      }
    </tui-textfield>

    <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
      <button type="button" tuiButton appearance="secondary" size="m" (click)="ref.close()">{{ t('common.cancel') }}</button>
      <button type="submit" tuiButton size="m" [disabled]="form.invalid" [class.loading]="saving">{{ existingEvent ? t('common.save') : t('patient_events.new_event') }}</button>
    </div>
  </form>
</div>
