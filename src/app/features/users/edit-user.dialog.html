<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 mt-2" *transloco="let t">
  <div class="grid grid-cols-2 gap-4">
    <tui-textfield class="w-full">
      <label tuiLabel for="firstName">{{ t('users.first_name') }}</label>
      <input id="firstName" formControlName="firstName" tuiInput />
    </tui-textfield>
    <tui-textfield class="w-full">
      <label tuiLabel for="lastName">{{ t('users.last_name') }}</label>
      <input id="lastName" formControlName="lastName" tuiInput />
    </tui-textfield>
  </div>

  <tui-textfield class="w-full">
    <label tuiLabel for="email">{{ t('users.email') }}</label>
    <input id="email" type="email" formControlName="email" tuiInput />
    @if (fieldErrors['email']) {
      <small class="text-red-500 mt-1 block">{{ fieldErrors['email'] }}</small>
    }
  </tui-textfield>

  @if (isStaff()) {
    <tui-textfield class="w-full">
      <label tuiLabel for="roleCode">{{ t('users.role') }}</label>
      <select id="roleCode" formControlName="roleCode" tuiInput>
        @for (role of staffRoles; track role.value) {
          <option [value]="role.value">{{ role.label }}</option>
        }
      </select>
    </tui-textfield>
  }

  @if (!isStaff()) {
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <tui-textfield class="w-full">
        <label tuiLabel for="birthDate">{{ t('users.birth_date') }}</label>
        <input id="birthDate" type="date" formControlName="birthDate" tuiInput />
        @if (fieldErrors['birthDate']) {
          <small class="text-red-500">{{ fieldErrors['birthDate'] }}</small>
        }
      </tui-textfield>
      <tui-textfield class="w-full">
        <label tuiLabel for="heightCm">{{ t('users.height_cm') }}</label>
        <input id="heightCm" type="number" formControlName="heightCm" min="30" max="275" step="0.1" tuiInput />
        @if (fieldErrors['heightCm']) {
          <small class="text-red-500">{{ fieldErrors['heightCm'] }}</small>
        }
      </tui-textfield>
      <tui-textfield class="w-full">
        <label tuiLabel for="gender">{{ t('users.gender') }}</label>
        <select id="gender" formControlName="gender" tuiInput>
          <option value="" disabled>Seleccionar...</option>
          @for (opt of genderOptions; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </tui-textfield>
    </div>
  }

  <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
    <button type="button" tuiButton appearance="secondary" size="m" (click)="cancel()">{{ t('common.cancel') }}</button>
    <button type="submit" tuiButton size="m" [disabled]="form.invalid">{{ t('users.update') }}</button>
  </div>
</form>
