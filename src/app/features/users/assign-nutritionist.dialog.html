<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 mt-2" *transloco="let t">
  <p class="text-sm text-surface-500 m-0">
    {{ t('users.assign_nutritionist_hint', { name: patientName }) }}
  </p>

  <tui-textfield class="w-full" tuiChevron [stringify]="nutritionistStringify" [tuiTextfieldCleaner]="false">
    <label tuiLabel for="assignNutritionist">{{ t('users.assigned_nutritionist') }}</label>
    <input id="assignNutritionist" formControlName="nutritionistId" tuiSelect />
    <tui-data-list-wrapper *tuiDropdown [items]="nutritionistValues()"></tui-data-list-wrapper>
  </tui-textfield>
  <tui-error formControlName="nutritionistId" />

  <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
    <button type="button" tuiButton appearance="secondary" size="m" (click)="cancel()">{{ t('common.cancel') }}</button>
    <button type="submit" tuiButton size="m" [disabled]="saving()">
      @if (saving()) {
        <i class="fa-solid fa-spinner fa-spin mr-1"></i>
      }
      {{ t('common.save') }}
    </button>
  </div>
</form>
