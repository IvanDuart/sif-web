<div class="flex flex-col gap-4 mt-2">
      <div class="bg-surface-50 dark:bg-surface-800 p-4 rounded-lg text-sm mb-2">
        Cambiando rol para: <strong>{{ fullName() }}</strong>
      </div>

      <div class="field flex flex-col gap-2">
        <label for="roleCode" class="font-medium">Nuevo Rol</label>
        <p-select 
          id="roleCode" 
          [(ngModel)]="selectedRole" 
          [options]="roles" 
          optionLabel="label" 
          optionValue="value" 
          class="w-full" 
          appendTo="body">
        </p-select>
      </div>

      <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
        <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="ref.close()"></p-button>
        <p-button label="Actualizar Rol" (onClick)="submit()" [loading]="saving()"></p-button>
      </div>
    </div>
