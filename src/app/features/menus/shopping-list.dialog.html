<div class="p-4">
  <div class="flex items-center justify-between mb-4">
    <div>
      <h2 class="text-lg font-bold">Lista de la Compra</h2>
      <p class="text-sm text-surface-500">
        {{ supermarketLabel() }} · {{ items.length }} producto{{ items.length !== 1 ? 's' : '' }} ·
        Total: {{ totalPrice.toFixed(2) }} €
      </p>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="data-table">
      <thead>
        <tr>
          <th style="width: 2rem;">#</th>
          <th>Producto</th>
          <th style="width: 5rem;">Cant.</th>
          <th style="width: 5rem;">Ud.</th>
          <th style="width: 8rem;">Categoría</th>
          <th style="width: 6rem;">Precio</th>
          <th>Notas</th>
          <th class="col-actions" style="width: 3rem;"></th>
        </tr>
      </thead>
      <tbody>
        @for (item of items; track item.id; let i = $index) {
          <tr>
            <td class="text-surface-400 text-center text-sm">{{ i + 1 }}</td>
            <td><input class="form-input" [(ngModel)]="item.name" /></td>
            <td>
              <input class="form-input" type="number" step="0.1" min="0" [(ngModel)]="item.quantity" />
            </td>
            <td>
              <select class="form-input" [(ngModel)]="item.unit">
                <option value=""></option>
                <option value="kg">kg</option>
                <option value="g">g</option>
                <option value="l">l</option>
                <option value="ml">ml</option>
                <option value="unidad">ud.</option>
                <option value="pack">pack</option>
                <option value="caja">caja</option>
                <option value="lata">lata</option>
                <option value="botella">botella</option>
              </select>
            </td>
            <td><input class="form-input" [(ngModel)]="item.category" /></td>
            <td>
              <input class="form-input" type="number" step="0.01" min="0" [(ngModel)]="item.estimatedPrice" />
            </td>
            <td><input class="form-input" [(ngModel)]="item.notes" /></td>
            <td>
              <button class="btn-icon btn-icon--danger" type="button" (click)="deleteItem(i)">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <button class="btn-secondary mt-3" type="button" (click)="addItem()">
    <i class="fa-solid fa-plus"></i>
    Añadir producto
  </button>

  <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
    <button class="btn-secondary" type="button" (click)="copyToClipboard()">
      <i class="fa-solid fa-copy"></i>
      Copiar
    </button>
    <button class="btn-primary" type="button" (click)="close()">
      Cerrar
    </button>
  </div>
</div>
