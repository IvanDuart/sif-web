<div class="flex flex-col gap-4 mt-2">
  <tui-textfield class="w-full">
    <label tuiLabel for="menuName">{{ 'diets.menu_name' | transloco }}</label>
    <input tuiInput id="menuName" [ngModel]="name()" (ngModelChange)="name.set($event)" [placeholder]="'diets.menu_name_placeholder' | transloco" />
  </tui-textfield>

  <tui-textfield class="w-full" [tuiTextfieldCleaner]="false">
    <label tuiLabel for="menuDescription">{{ 'diets.menu_description' | transloco }}</label>
    <input tuiInput id="menuDescription" [ngModel]="description()" (ngModelChange)="description.set($event)" [placeholder]="'diets.menu_description_placeholder' | transloco" />
  </tui-textfield>

  <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-line">
    <button type="button" tuiButton appearance="secondary" size="m" (click)="cancel()">{{ 'common.cancel' | transloco }}</button>
    <button type="button" tuiButton size="m" [disabled]="!name().trim() || saving()" [class.loading]="saving()" (click)="submit()">{{ 'common.save' | transloco }}</button>
  </div>
</div>
