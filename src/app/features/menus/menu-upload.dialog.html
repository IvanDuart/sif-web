<div class="flex flex-col gap-4 mt-2">
  <div class="bg-primary-50 dark:bg-brand-tint-20 p-4 rounded-lg flex items-start gap-3 mb-2">
    <i class="fa-solid fa-wand-magic-sparkles text-primary-500 text-xl mt-1"></i>
    <div class="text-sm">
      {{ 'diets.upload_description' | transloco }}
    </div>
  </div>

  @if (!hideUserPicker()) {
  <div class="field flex flex-col gap-1.5">
    <label for="appUserId" class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ 'diets.target_patient' | transloco }}</label>
    <tui-textfield tuiChevron [stringify]="userStringify">
      <input id="appUserId" [(ngModel)]="selectedUserId" tuiComboBox (input)="onPatientSearch($any($event).target.value)" [placeholder]="'diets.form_select_patient' | transloco" />
      <tui-data-list-wrapper *tuiDropdown [items]="users()"></tui-data-list-wrapper>
    </tui-textfield>
  </div>
  }

  <tui-textfield class="w-full">
    <label tuiLabel for="menuName">{{ 'diets.menu_name' | transloco }}</label>
    <input tuiInput id="menuName" [ngModel]="name()" (ngModelChange)="name.set($event)" [placeholder]="'diets.menu_name_placeholder' | transloco" />
  </tui-textfield>

  <tui-textfield class="w-full" [tuiTextfieldCleaner]="false">
    <label tuiLabel for="menuDescription">{{ 'diets.menu_description' | transloco }}</label>
    <input tuiInput id="menuDescription"  [ngModel]="description()" (ngModelChange)="description.set($event)" [placeholder]="'diets.menu_description_placeholder' | transloco" />
  </tui-textfield>

  @if (selectedUserId) {
  <div class="flex flex-col gap-2 mt-2">
    <p class="font-medium text-sm text-surface-700 dark:text-surface-300">{{ 'diets.document_label' | transloco }}</p>
    <label tuiInputFiles class="w-full">
      <input tuiInputFiles accept="image/*,application/pdf,.doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" [ngModel]="null" (ngModelChange)="onFileSelected($event)" [disabled]="uploading()" />
      <ng-template let-dragged>
        @if (dragged) {
          <div class="border-2 border-primary-500 border-dashed rounded-lg p-6 text-center bg-primary-50 dark:bg-brand-tint-20">
            <i class="fa-solid fa-cloud-arrow-down text-3xl text-primary-500 mb-2" aria-hidden="true"></i>
            <p class="text-sm text-primary-600 dark:text-primary-400 font-medium">
              {{ 'templates.upload_drop_here' | transloco }}
            </p>
          </div>
        } @else if (selectedFile(); as file) {
          <div class="relative group cursor-pointer">
            <div class="w-full py-6 rounded-lg border border-primary-300 dark:border-primary-700 bg-primary-50 dark:bg-brand-tint-20 flex flex-col items-center justify-center gap-2">
              <i class="fa-solid fa-file text-2xl text-primary-500" aria-hidden="true"></i>
              <span class="text-sm font-medium text-primary-700 dark:text-primary-300 px-3 text-center truncate max-w-full">{{ file.name }}</span>
              <span class="text-xs text-primary-500">({{ (file.size / 1024).toFixed(1) }} KB)</span>
            </div>
            <button tuiIconButton appearance="flat-destructive" size="xs" type="button" class="absolute -top-2 -right-2 shadow" (click)="removeFile(); $event.stopPropagation()" [title]="'common.remove' | transloco">
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>
        } @else {
          <div class="border-2 border-dashed border-surface-300 dark:border-surface-600 rounded-lg p-6 text-center hover:border-primary-400 dark:hover:border-primary-500 transition-colors cursor-pointer">
            <i class="fa-solid fa-cloud-arrow-up text-2xl text-surface-300 dark:text-surface-500 mb-2" aria-hidden="true"></i>
            <p class="text-sm text-surface-500">{{ 'templates.upload_hint' | transloco }}</p>
          </div>
        }
      </ng-template>
    </label>
  </div>
  }

  <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
    <button type="button" tuiButton appearance="secondary" size="m" (click)="cancel()">{{ 'common.cancel' | transloco }}</button>
    @if (selectedUserId && hasFile()) {
      <button type="button" tuiButton size="m" (click)="upload()" [class.loading]="uploading()">{{ 'diets.process_and_create' | transloco }}</button>
    }
  </div>
</div>
