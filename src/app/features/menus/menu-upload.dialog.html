<div class="flex flex-col gap-4 mt-2">
  <div class="bg-primary-50 dark:bg-brand-tint-20 p-4 rounded-lg flex items-start gap-3 mb-2">
    <i class="fa-solid fa-wand-magic-sparkles text-primary-500 text-xl mt-1"></i>
    <div class="text-sm">
      {{ 'diets.upload_description' | transloco }}
    </div>
  </div>

  <div class="field flex flex-col gap-1.5">
    <label for="appUserId" class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ 'diets.target_patient' | transloco }}</label>
    <select id="appUserId" [(ngModel)]="selectedUserId" class="form-input" [class.loading]="loadingUsers()">
      <option value="" disabled>{{ 'diets.form_select_patient' | transloco }}</option>
      @for (u of users(); track u.id) {
        <option [value]="u.id">{{ u.fullName }}</option>
      }
    </select>
  </div>

  @if (selectedUserId) {
  <div class="field flex flex-col gap-1.5 mt-2">
    <p class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ 'diets.document_label' | transloco }}</p>
    <input
      type="file"
      accept="image/*,application/pdf"
      (change)="onFileChange($event)"
      class="block w-full text-sm text-surface-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-primary-50 file:text-primary-700 hover:file:bg-primary-100 dark:file:bg-brand-tint-20 dark:file:text-primary-300" />
  </div>
  }

  <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
    <button type="button" tuiButton appearance="secondary" size="m" (click)="cancel()">{{ 'common.cancel' | transloco }}</button>
    @if (selectedUserId && selectedFile) {
      <button type="button" tuiButton size="m" (click)="upload()" [class.loading]="uploading()">{{ 'diets.process_and_create' | transloco }}</button>
    }
  </div>
</div>
