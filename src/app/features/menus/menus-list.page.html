<div class="p-4" *transloco="let t">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">{{ t('diets.title') }}</h1>
    <div class="flex gap-2">
      <p-button
        *appIfPermission="'MANAGE_MENU'"
        [label]="t('diets.upload_ocr')"
        icon="fa-solid fa-file-arrow-up"
        size="small"
        severity="secondary"
        (onClick)="uploadMenu()">
      </p-button>
      <p-button
        *appIfPermission="'MANAGE_MENU'"
        [label]="t('diets.create')"
        icon="fa-solid fa-plus"
        size="small"
        (onClick)="createMenu()">
      </p-button>
    </div>
  </div>

  <p-card>
    <p-table
      [value]="menus()"
      [loading]="loading()"
      [rows]="25"
      [paginator]="true"
      [totalRecords]="totalRecords()"
      [lazy]="true"
      [rowHover]="true"
      responsiveLayout="scroll"
      styleClass="p-datatable-sm"
      [rowsPerPageOptions]="[25, 50, 100]"
      [showCurrentPageReport]="true"
      [currentPageReportTemplate]="t('common.pagination_report', { first: '{first}', last: '{last}', totalRecords: '{totalRecords}' })"
      (onLazyLoad)="onPage($event)">
      <ng-template pTemplate="header">
        <tr>
          <th scope="col">{{ t('diets.name') }}</th>
          <th scope="col">{{ t('diets.status') }}</th>
          <th scope="col">{{ t('diets.created_at') }}</th>
          <th scope="col" style="width: 7rem; text-align: center;">{{ t('common.actions') }}</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-menu>
        <tr>
          <td class="font-medium">{{ menu.name }}</td>
          <td>
            <p-tag
              [severity]="menu.isActive || menu.active ? 'success' : 'secondary'"
              [value]="menu.isActive || menu.active ? t('diets.active') : t('diets.inactive')">
            </p-tag>
          </td>
          <td class="text-surface-500 text-sm">{{ menu.createdAt | date:'mediumDate' }}</td>
          <td style="text-align: center;">
            <div class="row-actions">
              <p-button
                icon="fa-solid fa-eye"
                [text]="true"
                [rounded]="true"
                severity="secondary"
                (onClick)="viewMenu(menu)"
                [title]="t('diets.view')">
              </p-button>
              <p-button
                *appIfPermission="'MANAGE_MENU'"
                icon="fa-solid fa-trash"
                [text]="true"
                [rounded]="true"
                severity="danger"
                (onClick)="deleteMenu(menu)"
                [title]="t('common.delete')">
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="table-empty-cell">
            <app-empty-state
              icon="fa-solid fa-utensils"
              [title]="t('diets.empty_title')"
              [description]="t('diets.empty')"
              [actionLabel]="t('diets.create')"
              (action)="createMenu()">
            </app-empty-state>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
