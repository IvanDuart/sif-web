<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 mt-2">
  <tui-textfield class="w-full">
    <label tuiLabel for="name">{{ 'diets.form_name_label' | transloco }}</label>
    <input id="name" formControlName="name" tuiInput [placeholder]="'diets.form_name_placeholder' | transloco" />
  </tui-textfield>

  <div class="field flex flex-col gap-1.5">
    <label for="appUserId" class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ 'diets.form_patient_label' | transloco }}</label>
    <tui-textfield tuiChevron [stringify]="userStringify">
      <input id="appUserId" formControlName="appUserId" tuiComboBox (input)="onPatientSearch($any($event).target.value)" [placeholder]="'diets.form_select_patient' | transloco" />
      <tui-data-list-wrapper *tuiDropdown [items]="users()"></tui-data-list-wrapper>
    </tui-textfield>
  </div>

  <label class="flex items-center gap-2 mt-2 cursor-pointer">
    <input type="checkbox" id="isActive" formControlName="isActive" tuiCheckbox />
    <span class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ 'diets.form_set_active' | transloco }}</span>
  </label>

  <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-line">
    <button type="button" tuiButton appearance="secondary" size="m" (click)="cancel()">{{ 'common.cancel' | transloco }}</button>
    <button type="submit" tuiButton size="m" [disabled]="form.invalid" [class.loading]="saving()">{{ 'diets.form_create' | transloco }}</button>
  </div>
</form>
