<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 mt-2">
      <div class="field flex flex-col gap-2">
        <label for="name" class="font-medium">Nombre de la Dieta / Menú</label>
        <input id="name" pInputText formControlName="name" class="w-full" placeholder="Ej: Dieta de Volumen 3000kcal" autofocus />
      </div>

      <div class="field flex flex-col gap-2">
        <label for="appUserId" class="font-medium">Paciente Asociado</label>
        <p-select 
          id="appUserId" 
          formControlName="appUserId" 
          [options]="users()" 
          optionLabel="fullName" 
          optionValue="id" 
          placeholder="Seleccionar Paciente" 
          [filter]="true" 
          filterBy="fullName" 
          class="w-full" 
          appendTo="body"
          [loading]="loadingUsers()">
        </p-select>
      </div>

      <div class="field flex items-center gap-2 mt-2">
        <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive"></p-checkbox>
        <label for="isActive" class="font-medium">Establecer como activo para este paciente</label>
      </div>

      <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
        <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="ref.close()"></p-button>
        <p-button label="Crear Menú" type="submit" [disabled]="form.invalid" [loading]="saving()"></p-button>
      </div>
    </form>
