<div class="space-y-6 pb-4" *transloco="let t">
  <!-- Header Section -->
  <div>
    <div class="mb-5 flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between lg:gap-6">
      <div class="min-w-0">
        <h1 class="font-display text-[26px] font-bold leading-tight tracking-tight text-surface-900 text-balance dark:text-surface-0 lg:text-[32px]">
          {{ t('help.title') }}
        </h1>
        <p class="mt-1.5 text-[13px] text-surface-500 dark:text-surface-400">
          {{ t('help.subtitle') }}
        </p>
      </div>
      <app-help-search
        class="lg:shrink-0"
        [query]="searchQuery()"
        (queryChange)="onSearchChange($event)"
        [placeholder]="t('help.search_placeholder')"
        [clearLabel]="t('help.clear_search')"
      />
    </div>

    <!-- Tabs Navigation -->
    <div class="overflow-x-auto border-b border-line">
      <tui-tabs
        class="bg-transparent"
        [activeItemIndex]="activeTabIndex()"
        (activeItemIndexChange)="onTabIndexChange($event)">
        @for (tab of tabs(); track tab.id) {
          <button tuiTab type="button" class="flex items-center gap-2 px-1 pb-1">
            <i [class]="tab.icon + ' text-[1.1em] opacity-80'"></i>
            <span class="text-sm font-medium">{{ tab.label }}</span>
          </button>
        }
      </tui-tabs>
    </div>
  </div>

  <!-- Main Content -->
  <div class="space-y-4" role="region" [attr.aria-label]="t('help.content_region')">
    @if (hasNoResults()) {
      <!-- No Results State -->
      <div class="py-16 text-center">
        <div class="mx-auto mb-4 inline-flex h-16 w-16 items-center justify-center rounded-pill bg-surface-100 dark:bg-surface-800">
          <i class="fa-solid fa-magnifying-glass text-2xl text-surface-400 dark:text-surface-500"></i>
        </div>
        <h2 class="mb-2 font-display text-[18px] font-bold text-surface-900 dark:text-surface-0">
          {{ t('help.no_results_title') }}
        </h2>
        <p class="mb-4 text-surface-500 dark:text-surface-400">
          {{ t('help.no_results_desc') }}
        </p>
        <button
          type="button"
          tuiButton
          appearance="secondary"
          size="m"
          (click)="onSearchChange('')"
        >
          <i class="fa-solid fa-arrow-rotate-left mr-1.5" aria-hidden="true"></i>
          {{ t('help.clear_search') }}
        </button>
      </div>
    } @else {
      <!-- Accordion Sections -->
      @for (section of filteredSections(); track section.id) {
        <app-help-accordion
          [section]="section"
          [deepLinkId]="section.id"
          (openSection)="onSectionOpen(section.id)"
        />
      }
    }
  </div>
</div>
