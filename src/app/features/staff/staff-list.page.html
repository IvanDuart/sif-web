<div class="p-4" *transloco="let t">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">{{ t('staff.title') }}</h1>
    <p-button *appIfPermission="'INVITE_USER'"
      [label]="t('staff.invite')"
      icon="fa-solid fa-user-plus"
      size="small"
      (onClick)="showInviteDialog()">
    </p-button>
  </div>

  <p-card>
    <p-table
      [value]="users()"
      [loading]="loading()"
      [rows]="10"
      [paginator]="true"
      [rowHover]="true"
      responsiveLayout="scroll"
      styleClass="p-datatable-sm">
      <ng-template pTemplate="header">
        <tr>
          <th scope="col">{{ t('users.first_name') }}</th>
          <th scope="col">{{ t('users.last_name') }}</th>
          <th scope="col">{{ t('users.email') }}</th>
          <th scope="col">{{ t('users.role') }}</th>
          <th scope="col">{{ t('users.status') }}</th>
          <th scope="col" style="width: 8rem; text-align: center;">{{ t('common.actions') }}</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-user>
        <tr>
          <td class="font-medium">{{ user.firstName }}</td>
          <td>{{ user.lastName }}</td>
          <td class="text-surface-500 text-sm">{{ user.email }}</td>
          <td>
            <p-tag
              [value]="getRole(user)"
              severity="info">
            </p-tag>
          </td>
          <td>
            <p-tag
              [severity]="user.enabled !== false ? 'success' : 'secondary'"
              [value]="user.enabled !== false ? t('users.enabled') : t('users.disabled')">
            </p-tag>
          </td>
          <td style="text-align: center;">
            <div class="row-actions">
              <p-button
                icon="fa-solid fa-eye"
                [text]="true"
                [rounded]="true"
                severity="secondary"
                [routerLink]="['/users', user.id]"
                [title]="t('common.view')">
              </p-button>
              <p-button
                *appIfPermission="'MANAGE_USER'"
                icon="fa-solid fa-pen"
                [text]="true"
                [rounded]="true"
                severity="secondary"
                (onClick)="editUser(user)"
                [title]="t('users.edit')">
              </p-button>
              <p-button
                *appIfPermission="'MANAGE_USER'"
                icon="fa-solid fa-user-xmark"
                [text]="true"
                [rounded]="true"
                severity="danger"
                (onClick)="revokeAccess(user)"
                [title]="t('users.revoke')">
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="table-empty-cell">
            <app-empty-state
              icon="fa-solid fa-user-doctor"
              [title]="t('staff.empty_title')"
              [description]="t('staff.empty')"
              [actionLabel]="t('staff.invite')"
              (action)="showInviteDialog()">
            </app-empty-state>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
