<div *transloco="let t">
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">

    <tui-textfield class="w-full">
      <label tuiLabel for="patientId">{{ t('appointments.patient') }}</label>
      <input
        id="patientId"
        tuiSelect
        formControlName="patientId"
      />
      <tui-data-list-wrapper
        *tuiDropdown
        [items]="patientValues()"
        [itemContent]="patientStringify | tuiStringifyContent"
      />
    </tui-textfield>

    <tui-textfield class="w-full">
      <label tuiLabel for="typeId">{{ t('appointments.type') }}</label>
      <input
        id="typeId"
        tuiSelect
        formControlName="typeId"
      />
      <tui-data-list-wrapper
        *tuiDropdown
        [items]="typeValues()"
        [itemContent]="typeStringify | tuiStringifyContent"
      />
    </tui-textfield>

    <tui-textfield class="w-full">
      <label tuiLabel for="startTime">{{ t('appointments.start_time') }}</label>
      <input id="startTime" tuiInputDateTime formControlName="startTime" />
    </tui-textfield>

    <tui-textfield class="w-full">
      <label tuiLabel for="notes">{{ t('appointments.notes') }}</label>
      <textarea
        id="notes"
        tuiTextarea
        formControlName="notes"
        rows="3">
      </textarea>
    </tui-textfield>

    <div class="flex justify-end gap-2 mt-2">
      <button class="btn-secondary" type="button" (click)="context.$implicit.complete()">{{ t('common.cancel') }}</button>
      <button type="submit" class="btn-primary" [disabled]="form.invalid || saving()">
        @if (saving()) {
          <i class="fa-solid fa-spinner fa-spin animate-spin mr-1"></i>
        }
        {{ t('appointments.schedule_new') }}
      </button>
    </div>
  </form>

  @if (error()) {
    <p class="text-red-500 text-sm mt-2">{{ error() }}</p>
  }
</div>
