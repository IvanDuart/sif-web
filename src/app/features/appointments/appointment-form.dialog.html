<div *transloco="let t" xmlns="http://www.w3.org/1999/html">
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">

    <tui-textfield tuiChevron>
      <label tuiLabel>{{ t('appointments.patient') }}</label>
      <input
        id="patientId"
        tuiComboBox
        formControlName="patientId">
      <tui-data-list-wrapper
        *tuiDropdown
        [items]="patientLabels() | tuiFilterByInput" />
    </tui-textfield>

    <tui-textfield tuiChevron>
      <label tuiLabel>{{ t('appointments.type') }}</label>
      <input
        id="typeId"
        tuiComboBox
        formControlName="typeId">
      <tui-data-list-wrapper
        *tuiDropdown
        [items]="typeLabels() | tuiFilterByInput" />
    </tui-textfield>

    <tui-textfield>
      <label tuiLabel>{{ t('appointments.start_time') }}</label>
      <input
        tuiInput
        type="datetime-local"
        id="startTime"
        formControlName="startTime"
        (input)="onStartTimeChange()" />
    </tui-textfield>

    @if (isHolidayDate()) {
      <div class="flex items-center gap-2 p-3 rounded bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800">
        <i class="fa-solid fa-calendar-xmark text-red-500"></i>
        <span class="text-sm text-red-700 dark:text-red-300">Festivo - el centro está cerrado</span>
      </div>
    } @else if (isClosedDate()) {
      <div class="flex items-center gap-2 p-3 rounded bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800">
        <i class="fa-solid fa-clock text-amber-500"></i>
        <span class="text-sm text-amber-700 dark:text-amber-300">El centro está cerrado este día</span>
      </div>
    } @else if (scheduleInfo()) {
      <div class="flex items-center gap-2 p-3 rounded bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800">
        <i class="fa-solid fa-clock text-blue-500"></i>
        <span class="text-sm text-blue-700 dark:text-blue-300">{{ scheduleInfo() }}</span>
      </div>
    }


    <tui-textfield>
      <label tuiLabel>
        {{ t('appointments.notes') }}
      </label>
      <textarea
                tuiTextarea
                formControlName="notes"
                ></textarea>

    </tui-textfield>


    <button
      tuiButton
      type="submit"
      [disabled]="form.invalid || saving()"
      class="w-full">
      @if (saving()) {
        {{ t('common.loading') }}
      } @else {
        {{ t('common.save') }}
      }
    </button>

  </form>

  @if (error()) {
    <p class="text-red-500 text-sm mt-2">{{ error() }}</p>
  }
</div>
