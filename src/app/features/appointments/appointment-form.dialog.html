<div *transloco="let t" xmlns="http://www.w3.org/1999/html">
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">

    <tui-textfield tuiChevron>
      <label tuiLabel>{{ t('appointments.patient') }}</label>
      <input
        id="patientId"
        tuiComboBox
        formControlName="patientId">
      <tui-data-list-wrapper
        *tuiDropdown
        [items]="patientLabels() | tuiFilterByInput" />
    </tui-textfield>

    <tui-textfield tuiChevron>
      <label tuiLabel>{{ t('appointments.type') }}</label>
      <input
        id="typeId"
        tuiComboBox
        formControlName="typeId">
      <tui-data-list-wrapper
        *tuiDropdown
        [items]="typeLabels() | tuiFilterByInput" />
    </tui-textfield>

    <tui-textfield>
      <label tuiLabel>{{ t('appointments.start_time') }}</label>
      <input
        tuiInput
        type="datetime-local"
        id="startTime"
        formControlName="startTime" />
    </tui-textfield>


    <tui-textfield>
      <label tuiLabel>
        {{ t('appointments.notes') }}
      </label>
      <textarea
                tuiTextarea
                formControlName="notes"
                ></textarea>

    </tui-textfield>


    <button
      tuiButton
      type="submit"
      [disabled]="form.invalid || saving()"
      class="w-full">
      @if (saving()) {
        {{ t('common.loading') }}
      } @else {
        {{ t('common.save') }}
      }
    </button>

  </form>

  @if (error()) {
    <p class="text-red-500 text-sm mt-2">{{ error() }}</p>
  }
</div>
