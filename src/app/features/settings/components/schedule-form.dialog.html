<div *transloco="let t" class="w-full">
  <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4 mt-2">
    <tui-textfield class="w-full">
      <label tuiLabel for="scheduleName">{{ t('schedule_settings.name') }}</label>
      <input id="scheduleName" tuiInput formControlName="name" />
    </tui-textfield>

    <tui-textfield class="w-full">
      <label tuiLabel for="scheduleColor">{{ t('schedule_settings.color') }}</label>
      <input
        id="scheduleColor"
        list="scheduleColors"
        placeholder="#059669"
        tuiInputColor
        formControlName="color" />
      <datalist id="scheduleColors">
        <option value="#4F46E5"></option>
        <option value="#EF4444"></option>
        <option value="#10B981"></option>
        <option value="#F59E0B"></option>
        <option value="#3B82F6"></option>
        <option value="#8B5CF6"></option>
        <option value="#EC4899"></option>
        <option value="#06B6D4"></option>
      </datalist>
    </tui-textfield>

    <div class="border-t border-line pt-4">
      <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
        <span class="text-sm font-semibold text-surface-700 dark:text-surface-300">
          {{ t('schedule_settings.blocks_count', { count: details.length }) }}
        </span>
        <button
          tuiButton
          appearance="secondary"
          size="s"
          type="button"
          data-mascot-add="schedule.details"
          (click)="addBlock()">
          <i class="fa-solid fa-plus mr-1" aria-hidden="true"></i>
          {{ t('schedule_settings.add_block') }}
        </button>
      </div>

      <div formArrayName="details" class="space-y-2">
        @for (detail of details.controls; track detail; let i = $index) {
          <div
            [formGroupName]="i"
            [attr.data-mascot-row]="'details.' + i"
            class="grid grid-cols-1 items-end gap-3 rounded-md border border-line bg-surface-50 p-3 dark:bg-surface-800 sm:grid-cols-2 lg:grid-cols-[minmax(0,1.1fr)_minmax(0,1fr)_minmax(0,1fr)_auto]">
            <tui-textfield tuiChevron>
              <label tuiLabel [attr.for]="'scheduleDay' + i">{{ t('schedule_settings.day') }}</label>
              <input [attr.id]="'scheduleDay' + i" tuiComboBox formControlName="dayOfWeek" />
              <tui-data-list-wrapper *tuiDropdown [items]="dayLabels() | tuiFilterByInput" />
            </tui-textfield>
            <tui-textfield>
              <label tuiLabel [attr.for]="'scheduleStartTime' + i">{{ t('schedule_settings.start_time') }}</label>
              <input [attr.id]="'scheduleStartTime' + i" tuiInputTime formControlName="startTime" />
            </tui-textfield>
            <tui-textfield>
              <label tuiLabel [attr.for]="'scheduleEndTime' + i">{{ t('schedule_settings.end_time') }}</label>
              <input [attr.id]="'scheduleEndTime' + i" tuiInputTime formControlName="endTime" />
            </tui-textfield>
            <button
              tuiIconButton
              appearance="flat"
              size="s"
              type="button"
              class="justify-self-end text-err-text"
              [attr.title]="t('schedule_settings.remove_block')"
              [attr.aria-label]="t('schedule_settings.remove_block')"
              (click)="removeBlock(i)">
              <i class="fa-solid fa-trash" aria-hidden="true"></i>
            </button>
          </div>
        } @empty {
          <div class="rounded-md border border-dashed border-line px-4 py-6 text-center">
            <p class="text-sm text-surface-400">{{ t('schedule_settings.no_blocks') }}</p>
          </div>
        }
      </div>
    </div>

    <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-line">
      <button tuiButton appearance="secondary" size="m" type="button" (click)="context.$implicit.complete()">
        {{ t('common.cancel') }}
      </button>
      <button tuiButton size="m" type="submit" data-mascot-submit="schedule" [disabled]="form.invalid || saving()">
        @if (saving()) {
          <i class="fa-solid fa-spinner fa-spin mr-1.5" aria-hidden="true"></i>
        }
        {{ t('common.save') }}
      </button>
    </div>
  </form>
</div>
