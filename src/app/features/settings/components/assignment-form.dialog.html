<div *transloco="let t" class="w-full">
  <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4 mt-2">
    <tui-textfield tuiChevron>
      <label tuiLabel for="assignmentScheduleId">{{ t('schedule_settings.select_schedule') }}</label>
      <input id="assignmentScheduleId" tuiComboBox formControlName="scheduleId" />
      <tui-data-list-wrapper *tuiDropdown [items]="scheduleLabels() | tuiFilterByInput" />
    </tui-textfield>

    <tui-textfield>
      <label tuiLabel for="assignmentValidFrom">{{ t('schedule_settings.valid_from') }}</label>
      <input id="assignmentValidFrom" tuiInputDate formControlName="validFrom" />
      <tui-calendar *tuiDropdown />
    </tui-textfield>

    <label class="flex items-center gap-2 cursor-pointer p-2">
      <input
        type="checkbox"
        tuiCheckbox
        [formControl]="indefiniteCtrl" />
      <span class="text-sm text-surface-700 dark:text-surface-300">
        {{ t('schedule_settings.no_end_date') }}
      </span>
    </label>

    @if (!indefiniteCtrl.value) {
      <tui-textfield>
        <label tuiLabel for="assignmentValidTo">{{ t('schedule_settings.valid_to') }}</label>
        <input id="assignmentValidTo" tuiInputDate formControlName="validTo" />
        <tui-calendar *tuiDropdown />
      </tui-textfield>
    }

    <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
      <button tuiButton appearance="secondary" size="m" type="button" (click)="context.$implicit.complete()">
        {{ t('common.cancel') }}
      </button>
      <button tuiButton size="m" type="submit" [disabled]="form.invalid || saving()">
        @if (saving()) {
          <i class="fa-solid fa-spinner fa-spin"></i>
        }
        <i class="fa-solid fa-link mr-1"></i>
        {{ editing() ? t('schedule_settings.update_assignment') : t('schedule_settings.create_assignment') }}
      </button>
    </div>
  </form>
</div>
