<div *transloco="let t" class="w-full">
  <header class="mb-5">
    <h2 class="font-display text-[18px] font-bold tracking-tight text-surface-900 dark:text-surface-0">
      {{ t('settings.address_tab') }}
    </h2>
    <p class="mt-1 text-[13px] text-surface-400">{{ t('settings.address_subtitle') }}</p>
  </header>

  <div class="data-card">
    @if (geoError()) {
      <div
        role="alert"
        class="mb-4 flex flex-wrap items-center gap-2 rounded-md bg-err-soft px-3 py-2 text-[13px] text-err-text"
      >
        <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
        <span>{{ t('settings.address_geo_error') }}</span>
        <button tuiButton appearance="flat" size="xs" type="button" (click)="retryGeo()">
          {{ t('common.retry') }}
        </button>
      </div>
    }
    @if (loading()) {
      <div class="flex items-center justify-center py-8" role="status" [attr.aria-label]="t('common.loading')">
        <div class="loading-spinner"></div>
      </div>
    } @else {
      <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
        <tui-textfield tuiChevron>
          <label tuiLabel for="addressCountry">{{ t('settings.address_country') }}</label>
          <input id="addressCountry" data-mascot-field="tenant-profile.countryDisplay" tuiComboBox [(ngModel)]="countryDisplay" (ngModelChange)="onCountryChange()" [disabled]="geoError()" />
          <tui-data-list-wrapper *tuiDropdown [items]="countryLabels() | tuiFilterByInput" />
        </tui-textfield>

        <tui-textfield tuiChevron>
          <label tuiLabel for="addressState">{{ t('settings.address_state') }}</label>
          <input id="addressState" data-mascot-field="tenant-profile.stateDisplay" tuiComboBox [(ngModel)]="stateDisplay" (ngModelChange)="onStateChange()" [disabled]="geoError() || !countryDisplay" />
          <tui-data-list-wrapper *tuiDropdown [items]="stateLabels() | tuiFilterByInput" />
        </tui-textfield>

        <tui-textfield tuiChevron>
          <label tuiLabel for="addressCity">{{ t('settings.address_city') }}</label>
          <input id="addressCity" data-mascot-field="tenant-profile.cityDisplay" tuiComboBox [(ngModel)]="cityDisplay" (focus)="loadCitiesIfNeeded()" [disabled]="geoError() || !stateDisplay" />
          <tui-data-list-wrapper *tuiDropdown [items]="cityLabels() | tuiFilterByInput" />
        </tui-textfield>
      </div>

      <tui-textfield class="mt-5 w-full">
        <label tuiLabel for="addressStreet">{{ t('settings.address_street') }}</label>
        <input id="addressStreet" data-mascot-field="tenant-profile.address" tuiInput [(ngModel)]="address" placeholder="C/ Mayor 1, 07001 Palma" />
      </tui-textfield>

      <div class="mt-6 flex justify-end border-t border-line pt-5">
        <button tuiButton appearance="primary" size="m" type="button" data-mascot-submit="tenant-profile" [disabled]="saving()" (click)="save()">
          @if (saving()) {
            <i class="fa-solid fa-spinner fa-spin mr-1.5" aria-hidden="true"></i>
          } @else {
            <i class="fa-solid fa-floppy-disk mr-1.5" aria-hidden="true"></i>
          }
          {{ t('common.save') }}
        </button>
      </div>
    }
  </div>
</div>
