<div class="p-4 lg:p-6" *transloco="let t">
  <h1 class="text-2xl font-display font-bold text-surface-900 dark:text-surface-0 mb-6">{{ t('menu.settings') }}</h1>

  <tui-tabs [(activeItemIndex)]="activeTab">
    <button tuiTab type="button">
      {{ t('settings.branding_tab') }}
    </button>
    <button tuiTab type="button">
      {{ t('appointment_types.title') }}
    </button>
    <button tuiTab type="button">
      {{ t('settings.anamnesis_tab', { defaultValue: 'Anamnesis' }) }}
    </button>
  </tui-tabs>

  @if (activeTab === 0) { <app-branding-settings /> }
  @if (activeTab === 1) { <app-appointment-types-settings /> }
  @if (activeTab === 2) { <app-anamnesis-settings /> }
</div>
