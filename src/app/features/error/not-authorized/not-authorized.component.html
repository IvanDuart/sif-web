<div class="grid min-h-[60vh] place-items-center px-4" *transloco="let t">
  <div class="w-full max-w-md text-center">
    <span
      class="mx-auto mb-5 grid size-14 place-items-center rounded-pill bg-brand-tint-10 text-err"
      aria-hidden="true"
    >
      <i class="fa-solid fa-lock text-xl"></i>
    </span>

    <p class="font-display text-[64px] font-bold leading-none tracking-tight text-surface-900 tabular-nums dark:text-surface-0">
      {{ t('errors.not_authorized_title') }}
    </p>

    <h1 class="mt-3 font-display text-[22px] font-bold tracking-tight text-surface-900 dark:text-surface-0">
      {{ t('errors.not_authorized') }}
    </h1>

    <p class="mt-3 text-[14px] leading-relaxed text-surface-500 dark:text-surface-400">
      {{ t('errors.not_authorized_desc') }}
    </p>

    <a tuiButton appearance="primary" size="m" class="mt-7 inline-flex" routerLink="/dashboard">
      <i class="fa-solid fa-house mr-1.5" aria-hidden="true"></i>
      {{ t('errors.go_dashboard') }}
    </a>
  </div>
</div>
