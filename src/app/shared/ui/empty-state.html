<div class="flex flex-col items-center justify-center p-8 md:p-12 text-center rounded-2xl border border-dashed border-surface-200 dark:border-surface-700 bg-surface-50/60 dark:bg-surface-800/40">
  <div class="w-16 h-16 rounded-2xl bg-primary-50 dark:bg-primary-900/40 flex items-center justify-center mb-5 ring-1 ring-surface-200 dark:ring-surface-700">
    <i [class]="icon() + ' text-2xl text-primary-600 dark:text-primary-400'"></i>
  </div>

  <h3 class="text-lg font-display font-bold tracking-tight text-surface-900 dark:text-surface-0 mb-1 text-balance">
    {{ title() }}
  </h3>

  <p class="text-sm leading-relaxed text-surface-600 dark:text-surface-400 mb-6 max-w-[45ch] text-pretty">
    {{ description() }}
  </p>

  @if (actionLabel()) {
    <button tuiButton type="button" size="m" (click)="action.emit()">
      <span class="inline-flex items-center gap-2">
        <i [class]="actionIcon()"></i>
        {{ actionLabel() }}
      </span>
    </button>
  }
</div>
