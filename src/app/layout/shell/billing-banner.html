@if (copy(); as banner) {
  <div
    *transloco="let t"
    role="status"
    class="mb-5 flex flex-col gap-3 rounded-xl border px-4 py-3 sm:flex-row sm:items-center sm:gap-4"
    [class]="toneClasses()"
  >
    <i [class]="banner.icon" class="hidden shrink-0 text-base sm:block" aria-hidden="true"></i>

    <p class="min-w-0 flex-1 text-[13px] font-medium leading-snug">
      {{ t(banner.messageKey, { days: banner.params.days, date: paidUntil() | date: 'longDate' }) }}
    </p>

    <a
      tuiButton
      appearance="secondary"
      size="s"
      routerLink="/billing"
      class="shrink-0 self-start sm:self-auto"
    >
      {{ t(banner.ctaKey) }}
    </a>
  </div>
}
