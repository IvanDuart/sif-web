<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda — Panel del profesional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --canvas:#FBFAF8; --surface:#FFFFFF; --sunken:#F4F2EE;
    --line:#EAE7E1; --line-strong:#D8D4CC;
    --ink-3:#9A958C; --ink-2:#6B665E; --ink:#1F1D1A;
    --primary:#2F5D4F; --primary-hover:#264B40; --primary-soft:#EDF2F0;
    --accent:#C45608; --accent-soft:#FAF0EA;
    --ok:#2D7A5F; --warn:#B5892C; --err:#B04A3E; --info:#3C6E96;
    --r-sm:8px; --r-md:12px; --r-pill:999px;
    --font-ui:'Inter', system-ui, sans-serif;
    --font-display:'Source Serif 4', Georgia, serif;
    --display-weight:600; --display-spacing:-0.01em;
    --shadow-float:0 1px 2px rgba(31,29,26,.04), 0 8px 24px rgba(31,29,26,.06);
    --hour:62px;           /* alto de una hora */
    --gutter:60px;         /* ancho de la columna de horas */
  }
  html[data-type="a"]{ --font-display:'Inter Tight', system-ui, sans-serif; --display-weight:600; --display-spacing:-0.02em; }
  html[data-type="c"]{ --font-display:'Satoshi', system-ui, sans-serif; --display-weight:700; --display-spacing:-0.02em; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--canvas);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:var(--display-spacing);line-height:1.2;margin:0;}
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:4px;}

  .app{display:grid;grid-template-columns:244px 1fr;min-height:100vh;}

  /* ---------- Barra lateral ---------- */
  .side{border-right:1px solid var(--line);background:var(--canvas);padding:24px 16px;display:flex;flex-direction:column;gap:32px;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px;}
  .brand-logo{height:34px;width:auto;display:block;flex:none;}
  .brand-sub{font-size:12px;color:var(--ink-3);}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink-2);font-size:14.5px;transition:background .12s ease,color .12s ease;}
  .nav-item:hover{background:var(--sunken);color:var(--ink);}
  .nav-item[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:500;}
  .nav-item svg{flex:none;}
  .nav-badge{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .nav-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:16px;border-top:1px solid var(--line);}
  .who{display:flex;align-items:center;gap:10px;padding:8px 10px;}
  .who .av{width:28px;height:28px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600;}
  .who .nm{font-size:13.5px;line-height:1.25;}
  .who .rl{font-size:12px;color:var(--ink-3);line-height:1.25;}

  /* ---------- Cabecera de la pantalla ---------- */
  .main{padding:28px 32px 48px;max-width:1500px;}
  .topbar{display:flex;align-items:flex-start;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
  .topbar h1{font-size:30px;}
  .range{font-size:13px;color:var(--ink-3);margin:6px 0 0;}
  .topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

  .btn-primary{background:var(--primary);color:#fff;padding:10px 16px;border-radius:var(--r-sm);font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:7px;transition:background .12s ease;}
  .btn-primary:hover{background:var(--primary-hover);}
  .btn-primary:disabled{opacity:.35;cursor:not-allowed;}
  .btn-quiet{background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:var(--r-sm);font-size:14px;color:var(--ink-2);transition:border-color .12s ease,color .12s ease;}
  .btn-quiet:hover{border-color:var(--line-strong);color:var(--ink);}

  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);overflow:hidden;}
  .stepper button{padding:8px 11px;color:var(--ink-2);display:grid;place-items:center;}
  .stepper button:hover{background:var(--sunken);color:var(--ink);}
  .stepper .today{border-left:1px solid var(--line);border-right:1px solid var(--line);font-size:14px;padding:8px 14px;}

  .segmented{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);overflow:hidden;}
  .segmented button{padding:8px 15px;font-size:14px;color:var(--ink-2);transition:background .12s ease,color .12s ease;}
  .segmented button + button{border-left:1px solid var(--line);}
  .segmented button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary);font-weight:500;}

  /* ---------- Filtro de profesionales (solo administración) ---------- */
  .pros{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:6px;}
  .pros .lbl{font-size:12.5px;color:var(--ink-3);margin-right:2px;}
  .pro-chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:5px 12px 5px 9px;font-size:13.5px;color:var(--ink-2);transition:border-color .12s ease,color .12s ease;}
  .pro-chip:hover{border-color:var(--line-strong);color:var(--ink);}
  .pro-chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:500;}
  .pro-chip .sw{width:9px;height:9px;border-radius:var(--r-pill);flex:none;}
  .pro-chip[aria-pressed="false"] .sw{opacity:.3;}

  /* ---------- Calendario ---------- */
  .cal{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden;}
  .cal-head{display:grid;grid-template-columns:var(--gutter) repeat(6,minmax(0,1fr));border-bottom:1px solid var(--line);}
  .cal-head .corner{border-right:1px solid var(--line);}
  .dayhead{padding:12px 10px;border-right:1px solid var(--line);text-align:center;}
  .dayhead:last-child{border-right:none;}
  .dayhead .dw{font-size:12.5px;color:var(--ink-3);}
  .dayhead .dn{font-family:var(--font-display);font-weight:var(--display-weight);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px;}
  .dayhead .load{font-size:11.5px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums;}
  .dayhead.today .dn{color:var(--accent);}
  .dayhead.today .dw{color:var(--accent);}

  .cal-body{display:grid;grid-template-columns:var(--gutter) repeat(6,minmax(0,1fr));position:relative;}
  .gutter{position:relative;border-right:1px solid var(--line);}
  .gutter .hr{position:absolute;right:9px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;transform:translateY(-50%);}
  .col{position:relative;border-right:1px solid var(--line);}
  .col:last-child{border-right:none;}
  .col.off{background:repeating-linear-gradient(135deg,transparent,transparent 7px,rgba(154,149,140,.07) 7px,rgba(154,149,140,.07) 14px);}
  .rules{position:absolute;inset:0;pointer-events:none;}
  .rules .r{position:absolute;left:0;right:0;border-top:1px solid var(--line);}
  .rules .r.half{border-top-style:dotted;opacity:.6;}
  .closed{position:absolute;left:0;right:0;background:var(--sunken);display:grid;place-items:center;}
  .closed span{font-size:11.5px;color:var(--ink-3);}

  .slot-hint{position:absolute;left:4px;right:4px;border:1px dashed var(--primary);background:var(--primary-soft);border-radius:6px;opacity:0;pointer-events:none;display:grid;place-items:center;font-size:12px;color:var(--primary);}
  .col:hover .slot-hint{opacity:1;}

  .ev{position:absolute;left:4px;right:4px;border-radius:6px;padding:5px 8px 5px 9px;overflow:hidden;text-align:left;border:1px solid transparent;border-left-width:3px;transition:filter .12s ease;}
  .ev:hover{filter:brightness(.97);}
  .ev .t{font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.75;}
  .ev .n{font-size:12.5px;font-weight:500;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ev .k{font-size:11.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ev.short{padding-top:3px;}
  .ev.short .t{display:inline;} .ev.short .k{display:none;}
  .ev.past{opacity:.5;}
  .ev.noshow{border-style:dashed;border-left-style:solid;}
  .ev.block{background:var(--sunken)!important;border-left-color:var(--line-strong)!important;color:var(--ink-3);}

  .nowline{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--accent);z-index:3;pointer-events:none;}
  .nowline::before{content:'';position:absolute;left:-4px;top:-4px;width:7px;height:7px;border-radius:var(--r-pill);background:var(--accent);}

  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--ink-3);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:block;}

  /* ---------- Panel lateral ---------- */
  /* ===== Diálogos centrados (patrón único de la app) ===== */
  .dialog{position:fixed;inset:0;z-index:31;display:none;place-items:center;padding:24px;background:rgba(31,29,26,.22);}
  .dialog.on{display:grid;}
  .dialog .panel{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-float);width:100%;max-width:520px;max-height:min(84vh,780px);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(10px) scale(.99);transition:opacity .15s ease,transform .15s ease;}
  .dialog.on .panel{opacity:1;transform:none;}
  @starting-style{ .dialog.on .panel{opacity:0;transform:translateY(10px) scale(.99);} }
  .dialog[data-size="sm"] .panel{max-width:440px;}
  .dialog[data-size="md"] .panel{max-width:560px;}
  .dialog[data-size="lg"] .panel{max-width:800px;}
  .dialog header{display:flex;align-items:center;gap:12px;padding:20px 24px 16px;border-bottom:1px solid var(--line);}
  .dialog header h2{font-size:19px;}
  .dialog .close{margin-left:auto;color:var(--ink-2);padding:6px;border-radius:var(--r-sm);display:grid;place-items:center;}
  .dialog .close:hover{background:var(--sunken);color:var(--ink);}
  .dialog .body{padding:22px 24px;overflow-y:auto;flex:1;}
  .dialog footer{padding:16px 24px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;}
  .dialog footer .sum{font-size:12.5px;color:var(--ink-3);line-height:1.35;}
  @media (prefers-reduced-motion:reduce){ .dialog .panel{transition:none;} }

  .field + .field{margin-top:20px;}
  .f-label{font-size:12.5px;color:var(--ink-2);margin:0 0 9px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:7px 11px;font-size:13.5px;color:var(--ink-2);line-height:1.2;transition:border-color .12s ease,background .12s ease,color .12s ease;}
  .chip:hover:not(:disabled){border-color:var(--line-strong);color:var(--ink);}
  .chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff;}
  .chip small{display:block;font-size:11.5px;opacity:.72;margin-top:2px;}
  .pt-input{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink);}
  .pt-input::placeholder{color:var(--ink-3);}
  .pt-input:focus{outline:none;border-color:var(--primary);}
  .results{margin-top:6px;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;max-height:168px;overflow-y:auto;}
  .results button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;font-size:13.5px;text-align:left;}
  .results button:hover{background:var(--sunken);}
  .results .av{width:26px;height:26px;border-radius:var(--r-pill);background:var(--sunken);color:var(--ink-2);display:grid;place-items:center;font-size:11px;font-weight:600;}
  .results .last{margin-left:auto;font-size:12px;color:var(--ink-3);}
  .picked{display:flex;align-items:center;gap:10px;border:1px solid var(--primary);background:var(--primary-soft);border-radius:var(--r-sm);padding:8px 10px;}
  .picked .av{width:28px;height:28px;border-radius:var(--r-pill);background:var(--surface);color:var(--primary);display:grid;place-items:center;font-size:11px;font-weight:600;}
  .picked .nm{font-size:14px;font-weight:500;}
  .picked .x{margin-left:auto;color:var(--ink-2);padding:4px;border-radius:var(--r-sm);display:grid;place-items:center;}
  .picked .x:hover{background:var(--surface);color:var(--ink);}
  .when-box{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--sunken);}
  .when-box .big{font-size:15px;font-weight:500;}
  .when-box .small{font-size:12.5px;color:var(--ink-2);margin-top:2px;}
  .note{font-size:13px;color:var(--ink-3);line-height:1.45;margin:10px 0 0;}
  .dt{display:grid;grid-template-columns:1fr 118px;gap:9px;margin-bottom:11px;}
  .dt label{display:block;font-size:11.5px;color:var(--ink-3);margin:0 0 5px;}
  .dt input{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums;}
  .dt input:focus{outline:none;border-color:var(--primary);}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .modes .chip{text-align:center;padding:9px 10px;}
  .slots{display:flex;flex-wrap:wrap;gap:6px;max-height:112px;overflow-y:auto;padding:2px;}
  .slots .chip{padding:6px 9px;font-size:13px;font-variant-numeric:tabular-nums;}
  .empty-slots{font-size:13px;color:var(--ink-3);margin:0;}

  .detail .row{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .detail .row .k{color:var(--ink-3);min-width:96px;font-size:13px;}
  .detail .acts{display:flex;flex-direction:column;gap:8px;margin-top:22px;}
  .detail .acts button{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:14px;transition:border-color .12s ease,background .12s ease;}
  .detail .acts button:hover{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);}
  .detail .acts button.danger:hover{border-color:var(--err);background:#FBF0EE;color:var(--err);}
  .tag{border-radius:var(--r-pill);padding:2px 9px;font-size:12px;font-weight:500;}
  .tag.first{background:var(--accent-soft);color:var(--accent);}
  .tag.rev{background:var(--sunken);color:var(--ink-2);}
  .tag.video{background:#EEF3F8;color:var(--info);}

  /* ---------- Conmutadores del prototipo ---------- */
  .proto{position:fixed;right:20px;bottom:20px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);box-shadow:var(--shadow-float);padding:6px 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .proto span{font-size:12px;color:var(--ink-3);padding-left:6px;}
  .proto button{padding:6px 11px;border-radius:var(--r-pill);font-size:12.5px;color:var(--ink-2);}
  .proto button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary);font-weight:500;}
  .proto .sep{width:1px;height:20px;background:var(--line);}

  @media (max-width:1180px){
    .app{grid-template-columns:72px 1fr;}
    .side{padding:24px 12px;}
    .brand-text,.nav-item span,.who .txt{display:none;}
    .nav-item{justify-content:center;}
    .main{padding:24px 18px 48px;}
  }
  @media (max-width:820px){
    .cal-wrap{overflow-x:auto;}
    .cal{min-width:760px;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>

<script>
(function () {
  /* ================== Datos ================== */
  var DAY0 = 21;                 // lunes 21 de septiembre de 2026
  var TODAY_IDX = 3;             // jueves
  var NOW = 11 * 60 + 20;
  var OPEN_FROM = 9 * 60, OPEN_TO = 19 * 60;
  var LUNCH = [14 * 60, 16 * 60];
  var HOUR_PX = 62, STEP = 15, BUFFER = 10;
  var DAYS = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];

  var PROS = [
    { id: 'marta', nm: 'Marta Ibáñez', color: '#2F5D4F', soft: '#EDF2F0' },
    { id: 'ruben', nm: 'Rubén Castells', color: '#3C6E96', soft: '#EEF3F8' },
    { id: 'aina', nm: 'Aina Prats', color: '#7A6A95', soft: '#F2F0F6' }
  ];
  var ME = 'marta';

  var TYPES = [
    { id: 'primera', label: 'Primera visita', dur: 60 },
    { id: 'revision', label: 'Revisión', dur: 45 },
    { id: 'video', label: 'Videoconsulta', dur: 30 }
  ];

  var PATIENTS = [
    { id: 1, nm: 'Javier Nadal', last: 'hace 6 sem' }, { id: 2, nm: 'Laura Vidal', last: 'hoy' },
    { id: 3, nm: 'Carmen Ruiz', last: 'hoy' }, { id: 4, nm: 'Inés Marco', last: 'hace 4 sem' },
    { id: 5, nm: 'Diego Salas', last: 'nuevo' }, { id: 6, nm: 'Nuria Ferrer', last: 'hace 5 sem' },
    { id: 7, nm: 'Óscar Peña', last: 'hoy' }, { id: 8, nm: 'Marta Sanchís', last: 'hace 9 sem' },
    { id: 9, nm: 'Pau Ribalta', last: 'hace 3 sem' }, { id: 10, nm: 'Elena Quirós', last: 'hace 7 sem' },
    { id: 11, nm: 'Rosa Ibarra', last: 'hace 2 sem' }, { id: 12, nm: 'Tomás Elías', last: 'hace 8 sem' }
  ];

  /* d = índice de día (0 lun … 5 sáb) */
  var EVENTS = [
    // lunes
    { d: 0, s: '09:00', t: 'revision', p: 'Rosa Ibarra', pro: 'marta' },
    { d: 0, s: '10:00', t: 'primera', p: 'Tomás Elías', pro: 'marta' },
    { d: 0, s: '11:15', t: 'revision', p: 'Pau Ribalta', pro: 'marta' },
    { d: 0, s: '12:30', t: 'video', p: 'Elena Quirós', pro: 'marta' },
    { d: 0, s: '16:00', t: 'revision', p: 'Laura Vidal', pro: 'ruben' },
    { d: 0, s: '17:00', t: 'primera', p: 'Nico Aguirre', pro: 'aina' },
    // martes
    { d: 1, s: '09:00', t: 'primera', p: 'Sara Cid', pro: 'marta' },
    { d: 1, s: '10:15', t: 'revision', p: 'Marta Sanchís', pro: 'marta' },
    { d: 1, s: '11:30', t: 'revision', p: 'Iván Roldán', pro: 'ruben' },
    { d: 1, s: '12:30', t: 'video', p: 'Clara Bosch', pro: 'marta' },
    { d: 1, s: '16:30', t: 'revision', p: 'Hugo Lamas', pro: 'aina' },
    { d: 1, s: '17:30', t: 'primera', p: 'Ana Terrats', pro: 'marta' },
    // miércoles
    { d: 2, s: '09:30', t: 'revision', p: 'Pau Ribalta', pro: 'marta' },
    { d: 2, s: '10:30', t: 'primera', p: 'Lucía Ferrán', pro: 'ruben' },
    { d: 2, s: '12:00', t: 'revision', p: 'Elena Quirós', pro: 'marta' },
    { d: 2, s: '16:00', t: 'block', p: 'Sesión de equipo', pro: 'marta', dur: 60 },
    { d: 2, s: '17:15', t: 'revision', p: 'Rosa Ibarra', pro: 'aina' },
    // jueves (hoy — coincide con el dashboard)
    { d: 3, s: '09:00', t: 'revision', p: 'Laura Vidal', pro: 'marta', st: 'asistida' },
    { d: 3, s: '09:45', t: 'video', p: 'Óscar Peña', pro: 'marta', st: 'no-asistida' },
    { d: 3, s: '10:30', t: 'primera', p: 'Carmen Ruiz', pro: 'marta', st: 'asistida' },
    { d: 3, s: '11:30', t: 'revision', p: 'Javier Nadal', pro: 'marta' },
    { d: 3, s: '12:15', t: 'video', p: 'Inés Marco', pro: 'marta' },
    { d: 3, s: '13:00', t: 'primera', p: 'Diego Salas', pro: 'marta' },
    { d: 3, s: '16:00', t: 'revision', p: 'Nuria Ferrer', pro: 'marta' },
    { d: 3, s: '10:00', t: 'revision', p: 'Berta Solé', pro: 'ruben' },
    { d: 3, s: '17:00', t: 'primera', p: 'Marc Vilalta', pro: 'aina' },
    // viernes
    { d: 4, s: '09:00', t: 'revision', p: 'Clara Bosch', pro: 'marta' },
    { d: 4, s: '10:00', t: 'revision', p: 'Sara Cid', pro: 'marta' },
    { d: 4, s: '11:00', t: 'primera', p: 'Guillem Roca', pro: 'marta' },
    { d: 4, s: '12:15', t: 'video', p: 'Ana Terrats', pro: 'ruben' },
    { d: 4, s: '16:00', t: 'revision', p: 'Hugo Lamas', pro: 'marta' },
    // sábado
    { d: 5, s: '10:00', t: 'primera', p: 'Neus Camps', pro: 'aina' },
    { d: 5, s: '11:15', t: 'revision', p: 'Iván Roldán', pro: 'aina' }
  ];

  /* ================== Utilidades ================== */
  function toMin(s) { var p = s.split(':'); return (+p[0]) * 60 + (+p[1]); }
  function toHHMM(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
  function typeOf(id) { return TYPES.filter(function (t) { return t.id === id; })[0]; }
  function proOf(id) { return PROS.filter(function (p) { return p.id === id; })[0]; }
  function durOf(e) { return e.t === 'block' ? (e.dur || 60) : typeOf(e.t).dur; }
  function initials(nm) { return nm.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase(); }
  function top(min) { return (min - OPEN_FROM) / 60 * HOUR_PX; }

  var state = { role: 'pro', visible: {} };
  PROS.forEach(function (p) { state.visible[p.id] = true; });

  function canSee(e) {
    if (state.role === 'pro') return e.pro === ME;
    return state.visible[e.pro];
  }

  /* ================== Construcción del calendario ================== */
  var head = document.getElementById('calHead');
  var body = document.getElementById('calBody');
  var gutter = document.getElementById('gutter');

  function buildShell() {
    // cabecera
    DAYS.forEach(function (dw, i) {
      var d = document.createElement('div');
      d.className = 'dayhead' + (i === TODAY_IDX ? ' today' : '');
      d.innerHTML = '<div class="dw">' + dw + '</div><div class="dn">' + (DAY0 + i) + '</div><div class="load" data-load="' + i + '"></div>';
      head.appendChild(d);
    });

    // franja horaria
    gutter.style.height = top(OPEN_TO) + 'px';
    for (var h = 9; h <= 19; h++) {
      var l = document.createElement('div');
      l.className = 'hr';
      l.style.top = top(h * 60) + 'px';
      l.textContent = toHHMM(h * 60);
      gutter.appendChild(l);
    }

    // columnas
    DAYS.forEach(function (dw, i) {
      var col = document.createElement('div');
      col.className = 'col';
      col.dataset.day = i;
      col.style.height = top(OPEN_TO) + 'px';

      var rules = document.createElement('div');
      rules.className = 'rules';
      for (var h = 9; h <= 19; h++) {
        var r = document.createElement('div'); r.className = 'r'; r.style.top = top(h * 60) + 'px'; rules.appendChild(r);
        if (h < 19) { var r2 = document.createElement('div'); r2.className = 'r half'; r2.style.top = top(h * 60 + 30) + 'px'; rules.appendChild(r2); }
      }
      col.appendChild(rules);

      var cl = document.createElement('div');
      cl.className = 'closed';
      cl.style.top = top(LUNCH[0]) + 'px';
      cl.style.height = ((i === 5 ? top(OPEN_TO) : top(LUNCH[1])) - top(LUNCH[0])) + 'px';
      cl.innerHTML = '<span>' + (i === 5 ? 'cerrado por la tarde' : 'comida') + '</span>';
      col.appendChild(cl);

      var hint = document.createElement('div');
      hint.className = 'slot-hint';
      hint.textContent = 'Agendar';
      col.appendChild(hint);

      col.addEventListener('mousemove', function (ev) {
        if (ev.target.closest('.ev')) { hint.style.display = 'none'; return; }
        hint.style.display = '';
        var y = ev.clientY - col.getBoundingClientRect().top;
        var min = Math.round((y / HOUR_PX * 60 + OPEN_FROM) / STEP) * STEP;
        if (min >= LUNCH[0] && (i === 5 || min < LUNCH[1])) { hint.style.display = 'none'; return; }
        hint.dataset.min = min;
        hint.style.top = top(min) + 'px';
        hint.style.height = (45 / 60 * HOUR_PX) + 'px';
      });
      col.addEventListener('mouseleave', function () { hint.style.display = ''; });
      col.addEventListener('click', function (ev) {
        if (ev.target.closest('.ev')) return;
        openNew(+col.dataset.day, +hint.dataset.min || OPEN_FROM);
      });

      body.appendChild(col);
    });
  }

  function renderEvents() {
    document.querySelectorAll('.ev').forEach(function (n) { n.remove(); });
    document.querySelectorAll('.nowline').forEach(function (n) { n.remove(); });

    var cols = body.querySelectorAll('.col');
    var counts = [0, 0, 0, 0, 0, 0];

    EVENTS.forEach(function (e, idx) {
      if (!canSee(e)) return;
      var col = cols[e.d];
      var st = toMin(e.s), dur = durOf(e);
      counts[e.d]++;

      var pro = proOf(e.pro);
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'ev' + (dur <= 30 ? ' short' : '') + (e.t === 'block' ? ' block' : '') +
        (e.st === 'no-asistida' ? ' noshow' : '') +
        ((e.d < TODAY_IDX || (e.d === TODAY_IDX && st + dur <= NOW)) ? ' past' : '');
      b.style.top = top(st) + 'px';
      b.style.height = Math.max(22, (dur / 60 * HOUR_PX) - 3) + 'px';
      b.style.background = pro.soft;
      b.style.borderLeftColor = pro.color;
      b.style.color = e.t === 'block' ? 'var(--ink-3)' : pro.color;
      b.dataset.i = idx;

      var label = e.t === 'block' ? 'Bloqueado' : typeOf(e.t).label;
      b.innerHTML = '<div class="t">' + e.s + '</div><div class="n">' + e.p + '</div><div class="k">' +
        (e.st === 'no-asistida' ? 'No asistió' : label) + '</div>';
      b.addEventListener('click', function () { openDetail(idx); });
      col.appendChild(b);
    });

    counts.forEach(function (c, i) {
      var el = document.querySelector('[data-load="' + i + '"]');
      el.textContent = c ? c + (c === 1 ? ' cita' : ' citas') : 'libre';
    });
    document.getElementById('navCount').textContent = counts[TODAY_IDX];

    var nl = document.createElement('div');
    nl.className = 'nowline';
    nl.style.top = top(NOW) + 'px';
    cols[TODAY_IDX].appendChild(nl);
  }

  /* ================== Filtro de profesionales ================== */
  var prosBar = document.getElementById('pros');
  function buildPros() {
    PROS.forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pro-chip';
      b.setAttribute('aria-pressed', String(state.visible[p.id]));
      b.innerHTML = '<i class="sw" style="background:' + p.color + '"></i>' + p.nm + (p.id === ME ? ' (tú)' : '');
      b.addEventListener('click', function () {
        state.visible[p.id] = !state.visible[p.id];
        b.setAttribute('aria-pressed', String(state.visible[p.id]));
        renderEvents();
      });
      prosBar.appendChild(b);
    });
  }

  function buildLegend() {
    var l = document.getElementById('legend');
    l.innerHTML = '<span><i style="background:#EDF2F0;border-left:3px solid #2F5D4F"></i>Presencial</span>' +
      '<span><i style="background:#F4F2EE;border-left:3px solid #D8D4CC"></i>Bloqueado</span>' +
      '<span><i style="background:#FFF;border:1px dashed #B04A3E"></i>No asistió</span>' +
      '<span>Pulsa un hueco libre para agendar</span>';
  }

  function applyRole() {
    var admin = state.role === 'admin';
    prosBar.hidden = !admin;
    document.getElementById('meRole').textContent = admin ? 'Administradora del centro' : 'Nutricionista';
    renderEvents();
  }

  /* ================== Panel lateral ================== */
  var drawer = document.getElementById('drawer');
  var dTitle = document.getElementById('drawerTitle'), dBody = document.getElementById('drawerBody'), dFoot = document.getElementById('drawerFoot');

  var focoPrevio = null;
  function openDrawer(size) {
    focoPrevio = document.activeElement;
    drawer.dataset.size = size || 'md';
    drawer.classList.add('on');
    drawer.setAttribute('aria-hidden', 'false');
    var c = drawer.querySelector('.close'); if (c) c.focus();
  }
  function closeDrawer() {
    drawer.classList.remove('on');
    drawer.setAttribute('aria-hidden', 'true');
    if (focoPrevio && focoPrevio.focus) focoPrevio.focus();
  }
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  drawer.addEventListener('click', function (e) { if (e.target === drawer) closeDrawer(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

  function longDay(d) { return DAYS[d] + ' ' + (DAY0 + d) + ' de septiembre'; }

  function conflicts(day, start, dur, pro) {
    return EVENTS.some(function (e) {
      if (e.pro !== pro || e.d !== day) return false;
      var s = toMin(e.s), en = s + durOf(e);
      return start < en && start + dur > s;
    });
  }

  /* --- Fechas --- */
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var DIAS_L = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var LUNES = new Date(2026, 8, DAY0);
  function isoDe(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function fechaDe(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function isoDeIdx(i) { var d = new Date(LUNES.getTime()); d.setDate(LUNES.getDate() + i); return isoDe(d); }
  function idxDeIso(iso) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return -1;
    var n = Math.round((fechaDe(iso) - LUNES) / 86400000);
    return (n >= 0 && n <= 5) ? n : -1;
  }
  function largo(iso) {
    var d = fechaDe(iso);
    return DIAS_L[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear();
  }

  function huecos(iso, dur, pro) {
    var idx = idxDeIso(iso), out = [];
    for (var m = OPEN_FROM; m + dur <= OPEN_TO; m += STEP) {
      if (m < LUNCH[1] && m + dur > LUNCH[0]) continue;
      if (idx === TODAY_IDX && m < NOW) continue;
      if (idx >= 0 && conflicts(idx, m, dur, pro)) continue;
      out.push(m);
    }
    return out;
  }

  /* --- Nueva cita / bloqueo --- */
  var nw = null;
  function openNew(day, min, modo) {
    nw = {
      iso: isoDeIdx(day), min: min, type: 'revision', patient: null, pro: ME,
      modo: modo === 'bloqueo' ? 'bloqueo' : 'cita', motivo: '', dur: 60, foco: null
    };
    drawNew();
    openDrawer('md');
  }

  function durNw() { return nw.modo === 'bloqueo' ? nw.dur : typeOf(nw.type).dur; }

  function drawNew() {
    var bloque = nw.modo === 'bloqueo';
    var dur = durNw();
    var idx = idxDeIso(nw.iso);
    var valida = idx > -1 || /^\d{4}-\d{2}-\d{2}$/.test(nw.iso);
    var clash = idx > -1 && conflicts(idx, nw.min, dur, nw.pro);
    var comida = nw.min < LUNCH[1] && nw.min + dur > LUNCH[0];
    var tarde = nw.min + dur > OPEN_TO;
    var pronto = nw.min < OPEN_FROM;
    var pasada = idx > -1 && (idx < TODAY_IDX || (idx === TODAY_IDX && nw.min < NOW));
    var libres = valida ? huecos(nw.iso, dur, nw.pro) : [];

    dTitle.textContent = bloque ? 'Bloquear franja' : 'Nueva cita';

    dBody.innerHTML =
      '<div class="field"><p class="f-label">Qué quieres crear</p>' +
      '<div class="modes">' +
      '<button type="button" class="chip" data-modo="cita" aria-pressed="' + String(!bloque) + '">Cita con paciente</button>' +
      '<button type="button" class="chip" data-modo="bloqueo" aria-pressed="' + String(bloque) + '">Franja bloqueada</button>' +
      '</div></div>' +

      '<div class="field"><p class="f-label">Cuándo</p>' +
      '<div class="dt">' +
      '<div><label for="fIn">Fecha</label><input type="date" id="fIn" value="' + nw.iso + '" aria-label="Fecha"></div>' +
      '<div><label for="hIn">Hora</label><input type="time" id="hIn" step="900" value="' + toHHMM(nw.min) + '" aria-label="Hora de inicio"></div>' +
      '</div>' +
      (valida
        ? '<div class="when-box"><div class="big">' + largo(nw.iso) + ', ' + toHHMM(nw.min) + '</div>' +
          '<div class="small">termina a las ' + toHHMM(nw.min + dur) + ' · ' + dur + ' min</div></div>'
        : '<div class="when-box"><div class="big">Elige una fecha</div></div>') +
      (clash ? '<p class="note" style="color:var(--err)">Se solapa con otra cita tuya. Elige otra hora o acorta la duración.</p>' : '') +
      (comida && !clash ? '<p class="note" style="color:var(--warn)">Invade la franja de comida (14:00 – 16:00).</p>' : '') +
      (tarde && !clash ? '<p class="note" style="color:var(--warn)">Termina después del cierre (19:00).</p>' : '') +
      (pronto && !clash ? '<p class="note" style="color:var(--warn)">Empieza antes de la apertura (09:00).</p>' : '') +
      (pasada && !clash ? '<p class="note" style="color:var(--warn)">Esa hora ya ha pasado.</p>' : '') +
      (valida && idx < 0 ? '<p class="note">Esta fecha queda fuera de la semana que estás viendo. Se agendará igualmente y la agenda saltará a esa semana.</p>' : '') +
      (valida
        ? '<p class="f-label" style="margin:14px 0 8px">Huecos libres de ' + dur + ' min</p>' +
          (libres.length ? '<div class="slots" id="sWrap"></div>' : '<p class="empty-slots">No queda ningún hueco de ' + dur + ' min ese día.</p>')
        : '') +
      '</div>' +

      (bloque
        ? '<div class="field"><p class="f-label">Motivo</p>' +
          '<input class="pt-input" id="moIn" type="text" placeholder="Formación, reunión de equipo, personal…" value="' + nw.motivo.replace(/"/g, '&quot;') + '" aria-label="Motivo del bloqueo"></div>' +
          '<div class="field"><p class="f-label">Duración</p><div class="chips" id="tWrap"></div></div>'
        : '<div class="field"><p class="f-label">Paciente</p><div id="ptWrap"></div></div>' +
          '<div class="field"><p class="f-label">Tipo de cita</p><div class="chips" id="tWrap"></div></div>');

    dBody.querySelectorAll('[data-modo]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (nw.modo === b.dataset.modo) return;
        nw.modo = b.dataset.modo;
        drawNew();
      });
    });

    var fIn = document.getElementById('fIn'), hIn = document.getElementById('hIn');
    fIn.addEventListener('change', function () { nw.iso = this.value; nw.foco = 'fIn'; drawNew(); });
    hIn.addEventListener('change', function () {
      if (this.value) nw.min = toMin(this.value);
      nw.foco = 'hIn';
      drawNew();
    });

    var sw = document.getElementById('sWrap');
    if (sw) {
      libres.forEach(function (m) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'chip';
        b.setAttribute('aria-pressed', String(m === nw.min));
        b.textContent = toHHMM(m);
        b.addEventListener('click', function () { nw.min = m; nw.foco = null; drawNew(); });
        sw.appendChild(b);
      });
    }

    var tw = document.getElementById('tWrap');
    if (bloque) {
      [30, 60, 90, 120].forEach(function (d) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'chip';
        b.setAttribute('aria-pressed', String(d === nw.dur));
        b.innerHTML = (d < 60 ? d + ' min' : (d / 60) + (d === 60 ? ' hora' : ' horas'));
        b.addEventListener('click', function () { nw.dur = d; nw.foco = null; drawNew(); });
        tw.appendChild(b);
      });
      var mo = document.getElementById('moIn');
      mo.addEventListener('input', function () { nw.motivo = this.value; });
    } else {
      TYPES.forEach(function (ty) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'chip';
        b.setAttribute('aria-pressed', String(ty.id === nw.type));
        b.innerHTML = ty.label + '<small>' + ty.dur + ' min</small>';
        b.addEventListener('click', function () { nw.type = ty.id; nw.foco = null; drawNew(); });
        tw.appendChild(b);
      });
      drawPatient();
    }

    dFoot.innerHTML = '<button class="btn-primary" id="okBtn" type="button">' + (bloque ? 'Bloquear' : 'Agendar') + '</button><span class="sum" id="okSum"></span>';
    var ok = document.getElementById('okBtn');
    var falta = !valida ? 'Falta la fecha' : (bloque ? null : (!nw.patient ? 'Falta elegir paciente' : null));
    ok.disabled = !!falta || clash;
    document.getElementById('okSum').textContent = falta ? falta
      : clash ? 'Esa hora está ocupada'
        : bloque ? dur + ' min bloqueados el ' + fechaDe(nw.iso).getDate() + ' de ' + MESES[fechaDe(nw.iso).getMonth()]
          : nw.patient.nm + ', ' + dur + ' min';
    ok.addEventListener('click', confirmNew);

    if (nw.foco) { var f = document.getElementById(nw.foco); if (f) f.focus(); }
  }

  function drawPatient() {
    var wrap = document.getElementById('ptWrap');
    if (nw.patient) {
      wrap.innerHTML = '<div class="picked"><div class="av">' + initials(nw.patient.nm) + '</div>' +
        '<div class="nm">' + nw.patient.nm + '</div>' +
        '<button class="x" type="button" aria-label="Quitar paciente"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>';
      wrap.querySelector('.x').addEventListener('click', function () { nw.patient = null; nw.foco = null; drawNew(); });
      return;
    }
    wrap.innerHTML = '<input class="pt-input" id="ptS" type="text" placeholder="Escribe un nombre" autocomplete="off" aria-label="Buscar paciente"><div class="results" id="ptR" hidden></div>';
    var inp = document.getElementById('ptS'), res = document.getElementById('ptR');
    inp.addEventListener('input', function () {
      var q = this.value.trim().toLowerCase();
      var list = PATIENTS.filter(function (p) { return p.nm.toLowerCase().indexOf(q) > -1; }).slice(0, 5);
      if (!q || !list.length) { res.hidden = true; return; }
      res.innerHTML = '';
      list.forEach(function (p) {
        var b = document.createElement('button');
        b.type = 'button';
        b.innerHTML = '<span class="av">' + initials(p.nm) + '</span><span>' + p.nm + '</span><span class="last">' + p.last + '</span>';
        b.addEventListener('click', function () { nw.patient = p; nw.foco = null; drawNew(); });
        res.appendChild(b);
      });
      res.hidden = false;
    });
  }

  function confirmNew() {
    var bloque = nw.modo === 'bloqueo';
    var dur = durNw();
    var idx = idxDeIso(nw.iso);
    var motivo = nw.motivo.trim() || 'Franja bloqueada';

    if (idx > -1) {
      EVENTS.push(bloque
        ? { d: idx, s: toHHMM(nw.min), t: 'block', p: motivo, pro: nw.pro, dur: dur }
        : { d: idx, s: toHHMM(nw.min), t: nw.type, p: nw.patient.nm, pro: nw.pro });
      renderEvents();
    }

    dBody.innerHTML = '<div style="display:flex;flex-direction:column;gap:14px;align-items:flex-start">' +
      '<div style="width:34px;height:34px;border-radius:999px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center">' +
      '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 7"/></svg></div>' +
      '<h3 style="font-size:17px">' + (bloque ? 'Franja bloqueada' : 'Cita agendada') + '</h3>' +
      '<p style="margin:0;font-size:14px;color:var(--ink-2);line-height:1.5">' +
      (bloque ? motivo : nw.patient.nm + ', ' + typeOf(nw.type).label) + '<br>' +
      largo(nw.iso) + ', ' + toHHMM(nw.min) + ' – ' + toHHMM(nw.min + dur) + '</p>' +
      '<p class="note">' + (bloque
        ? 'Nadie podrá reservar en esa franja desde el portal del paciente.'
        : 'Le hemos enviado la confirmación por email. Recibirá recordatorios 48 y 2 horas antes.') +
      (idx < 0 ? ' Está fuera de la semana que se muestra ahora mismo.' : '') + '</p></div>';
    dFoot.innerHTML = '<button class="btn-quiet" type="button" id="cl">Cerrar</button>';
    document.getElementById('cl').addEventListener('click', closeDrawer);
  }

  /* --- Detalle de cita --- */
  function openDetail(idx) {
    var e = EVENTS[idx], pro = proOf(e.pro), dur = durOf(e);
    var bloque = e.t === 'block';
    dTitle.textContent = bloque ? 'Franja bloqueada' : 'Cita';

    var estado = e.st === 'no-asistida' ? 'No asistió'
      : e.st === 'asistida' ? 'Atendida'
        : (e.d < TODAY_IDX || (e.d === TODAY_IDX && toMin(e.s) + dur <= NOW)) ? 'Pasada' : 'Confirmada';

    var tagCls = e.t === 'primera' ? 'first' : e.t === 'video' ? 'video' : 'rev';

    dBody.innerHTML = '<div class="detail">' +
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px">' +
      '<div class="av" style="width:40px;height:40px;border-radius:999px;background:' + pro.soft + ';color:' + pro.color + ';display:grid;place-items:center;font-size:14px;font-weight:600">' + initials(e.p) + '</div>' +
      '<div><div style="font-size:16px;font-weight:500">' + e.p + '</div>' +
      (bloque ? '' : '<div style="font-size:13px;color:var(--ink-3)">Paciente desde 2025</div>') + '</div></div>' +
      '<div class="row"><span class="k">Cuándo</span><span>' + longDay(e.d) + ', ' + e.s + ' – ' + toHHMM(toMin(e.s) + dur) + '</span></div>' +
      (bloque ? '' : '<div class="row"><span class="k">Tipo</span><span class="tag ' + tagCls + '">' + typeOf(e.t).label + '</span></div>') +
      '<div class="row"><span class="k">Profesional</span><span><i style="display:inline-block;width:9px;height:9px;border-radius:999px;background:' + pro.color + ';margin-right:7px"></i>' + pro.nm + '</span></div>' +
      (bloque ? '' : '<div class="row"><span class="k">Estado</span><span>' + estado + '</span></div>') +
      '<div class="acts">' +
      (bloque ? '<button type="button" class="danger">Eliminar bloqueo</button>' :
        '<button type="button">Abrir ficha del paciente</button>' +
        '<button type="button">Reprogramar</button>' +
        '<button type="button">Enviar recordatorio</button>' +
        '<button type="button" class="danger">Cancelar cita</button>') +
      '</div></div>';
    dFoot.innerHTML = '<span class="sum">Los cambios se notifican al paciente por email.</span>';
    openDrawer('sm');
  }

  document.getElementById('newBtn').addEventListener('click', function () {
    var libres = huecos(isoDeIdx(TODAY_IDX), typeOf('revision').dur, ME);
    openNew(TODAY_IDX, libres.length ? libres[0] : OPEN_FROM);
  });

  /* ================== Controles del prototipo ================== */
  document.querySelectorAll('.proto [data-role]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.proto [data-role]').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      state.role = b.dataset.role;
      applyRole();
    });
  });
  document.querySelectorAll('.proto [data-set]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.proto [data-set]').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      document.documentElement.setAttribute('data-type', b.dataset.set);
    });
  });
  document.documentElement.setAttribute('data-type', 'b');

  buildShell();
  buildPros();
  buildLegend();
  applyRole();
})();
</script>
</body>
</html>
