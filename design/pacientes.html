<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pacientes — Panel del profesional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --canvas:#FBFAF8; --surface:#FFFFFF; --sunken:#F4F2EE;
    --line:#EAE7E1; --line-strong:#D8D4CC;
    --ink-3:#9A958C; --ink-2:#6B665E; --ink:#1F1D1A;
    --primary:#2F5D4F; --primary-hover:#264B40; --primary-soft:#EDF2F0;
    --accent:#C45608; --accent-soft:#FAF0EA;
    --ok:#2D7A5F; --warn:#B5892C; --warn-soft:#FBF4E6; --err:#B04A3E; --err-soft:#FBF0EE; --info:#3C6E96;
    --r-sm:8px; --r-md:12px; --r-pill:999px;
    --font-ui:'Inter', system-ui, sans-serif;
    --font-display:'Source Serif 4', Georgia, serif;
    --display-weight:600; --display-spacing:-0.01em;
    --shadow-float:0 1px 2px rgba(31,29,26,.04), 0 8px 24px rgba(31,29,26,.06);
  }
  html[data-type="a"]{ --font-display:'Inter Tight', system-ui, sans-serif; --display-weight:600; --display-spacing:-0.02em; }
  html[data-type="c"]{ --font-display:'Satoshi', system-ui, sans-serif; --display-weight:700; --display-spacing:-0.02em; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--canvas);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:var(--display-spacing);line-height:1.2;margin:0;}
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:4px;}

  .app{display:grid;grid-template-columns:244px 1fr;min-height:100vh;}

  .side{border-right:1px solid var(--line);background:var(--canvas);padding:24px 16px;display:flex;flex-direction:column;gap:32px;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px;}
  .brand-logo{height:34px;width:auto;display:block;flex:none;}
  .brand-sub{font-size:12px;color:var(--ink-3);}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink-2);font-size:14.5px;transition:background .12s ease,color .12s ease;}
  .nav-item:hover{background:var(--sunken);color:var(--ink);}
  .nav-item[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:500;}
  .nav-item svg{flex:none;}
  .nav-badge{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .nav-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:16px;border-top:1px solid var(--line);}
  .who{display:flex;align-items:center;gap:10px;padding:8px 10px;}
  .who .av{width:28px;height:28px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600;}
  .who .nm{font-size:13.5px;line-height:1.25;}
  .who .rl{font-size:12px;color:var(--ink-3);line-height:1.25;}

  .main{padding:28px 32px 56px;max-width:1500px;}
  .topbar{display:flex;align-items:flex-start;gap:20px;margin-bottom:24px;flex-wrap:wrap;}
  .topbar h1{font-size:30px;}
  .topbar .count{font-size:13px;color:var(--ink-3);margin:6px 0 0;}
  .topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px;}

  .btn-primary{background:var(--primary);color:#fff;padding:10px 16px;border-radius:var(--r-sm);font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:7px;transition:background .12s ease;}
  .btn-primary:hover{background:var(--primary-hover);}
  .btn-quiet{background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:var(--r-sm);font-size:14px;color:var(--ink-2);transition:border-color .12s ease,color .12s ease;}
  .btn-quiet:hover{border-color:var(--line-strong);color:var(--ink);}
  .btn-danger{background:var(--err);color:#fff;padding:9px 16px;border-radius:var(--r-sm);font-size:14px;font-weight:500;}
  .btn-danger:hover{background:#9A3F35;}

  .filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 12px;min-width:290px;transition:border-color .12s ease;}
  .search:focus-within{border-color:var(--primary);}
  .search svg{color:var(--ink-3);flex:none;}
  .search input{border:none;background:none;font:inherit;font-size:14px;padding:10px 0;width:100%;color:var(--ink);}
  .search input:focus{outline:none;}
  .search input::placeholder{color:var(--ink-3);}

  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:7px 13px;font-size:13.5px;color:var(--ink-2);transition:border-color .12s ease,background .12s ease,color .12s ease;}
  .chip:hover{border-color:var(--line-strong);color:var(--ink);}
  .chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff;}
  .chip .n{opacity:.6;font-variant-numeric:tabular-nums;margin-left:5px;}

  .prosbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 0;}
  .prosbar .lbl{font-size:12.5px;color:var(--ink-3);}
  .pro-chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:5px 12px 5px 9px;font-size:13.5px;color:var(--ink-2);}
  .pro-chip:hover{border-color:var(--line-strong);color:var(--ink);}
  .pro-chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:500;}
  .pro-chip .sw{width:9px;height:9px;border-radius:var(--r-pill);flex:none;}
  .pro-chip[aria-pressed="false"] .sw{opacity:.3;}

  .selbar{display:none;align-items:center;gap:14px;margin-top:16px;padding:11px 16px;border:1px solid var(--primary);background:var(--primary-soft);border-radius:var(--r-sm);flex-wrap:wrap;}
  .selbar.on{display:flex;}
  .selbar .c{font-size:14px;font-weight:500;color:var(--primary);}
  .selbar button{font-size:13.5px;color:var(--primary);border-bottom:1px solid transparent;}
  .selbar button:hover{border-color:var(--primary);}
  .selbar .danger{color:var(--err);}
  .selbar .danger:hover{border-color:var(--err);}
  .selbar .clear{margin-left:auto;color:var(--ink-2);}

  .tablewrap{margin-top:22px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  thead th{text-align:left;font-size:12.5px;font-weight:500;color:var(--ink-3);border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:2;white-space:nowrap;padding:0;}
  thead th.pad{padding:12px 16px;}
  thead th .sortbtn{display:flex;align-items:center;gap:5px;width:100%;padding:12px 16px;font-size:12.5px;font-weight:500;color:var(--ink-3);transition:color .12s ease,background .12s ease;}
  thead th .sortbtn:hover{color:var(--ink);background:var(--canvas);}
  thead th[aria-sort] .sortbtn{color:var(--ink);}
  .caret{opacity:0;transition:opacity .12s ease,transform .12s ease;flex:none;}
  thead th .sortbtn:hover .caret{opacity:.45;}
  thead th[aria-sort] .caret{opacity:1;}
  thead th[aria-sort="ascending"] .caret{transform:rotate(180deg);}

  tbody tr{border-bottom:1px solid var(--line);transition:background .12s ease;cursor:pointer;}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:var(--canvas);}
  tbody tr.sel{background:var(--primary-soft);}
  tbody tr.off .pt .nm,tbody tr.off td.num{color:var(--ink-3);}
  tbody tr.off .av{opacity:.55;}
  td{padding:13px 16px;font-size:14px;vertical-align:middle;}
  td.who-cell{min-width:230px;}
  .pt{display:flex;align-items:center;gap:12px;}
  .av{width:36px;height:36px;border-radius:var(--r-pill);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none;background:var(--sunken);color:var(--ink-2);}
  .pt .nm{font-size:14.5px;font-weight:500;line-height:1.25;}
  .pt .meta{font-size:12.5px;color:var(--ink-3);line-height:1.25;}
  .tag{border-radius:var(--r-pill);padding:3px 10px;font-size:12px;font-weight:500;white-space:nowrap;display:inline-block;}
  .tag.activo{background:var(--primary-soft);color:var(--primary);}
  .tag.pausa{background:var(--warn-soft);color:var(--warn);}
  .tag.alta{background:var(--sunken);color:var(--ink-2);}
  .tag.nuevo{background:var(--accent-soft);color:var(--accent);}
  .tag.inactivo{background:var(--sunken);color:var(--ink-3);}
  td.num{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13.5px;white-space:nowrap;}
  td.num .soft{color:var(--ink-3);}
  td.tel a{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap;}
  td.tel a:hover{color:var(--primary);text-decoration:underline;}
  td.acts{width:60px;}
  .kebab{width:30px;height:30px;border-radius:var(--r-sm);border:1px solid transparent;color:var(--ink-3);display:grid;place-items:center;margin-left:auto;opacity:0;transition:opacity .12s ease,border-color .12s ease,color .12s ease;}
  tr:hover .kebab,tr:focus-within .kebab,.kebab[aria-expanded="true"]{opacity:1;}
  .kebab:hover,.kebab[aria-expanded="true"]{border-color:var(--line);color:var(--ink);background:var(--surface);}

  .empty{padding:56px 24px;text-align:center;}
  .empty h3{font-size:18px;margin-bottom:8px;}
  .empty p{font-size:14px;color:var(--ink-2);margin:0 0 18px;}
  .foot{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);}
  .foot .more{margin-left:auto;}

  .menu{position:absolute;z-index:40;min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-float);padding:6px;display:none;}
  .menu.on{display:block;}
  .menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r-sm);font-size:14px;color:var(--ink-2);text-align:left;}
  .menu button:hover{background:var(--sunken);color:var(--ink);}
  .menu button svg{flex:none;color:var(--ink-3);}
  .menu button:hover svg{color:inherit;}
  .menu .sep{height:1px;background:var(--line);margin:6px 4px;}
  .menu .danger{color:var(--err);}
  .menu .danger svg{color:var(--err);}
  .menu .danger:hover{background:var(--err-soft);color:var(--err);}

  .modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(31,29,26,.22);padding:20px;}
  .modal.on{display:grid;}
  .modal .card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-float);max-width:430px;width:100%;padding:24px;max-height:min(84vh,780px);overflow-y:auto;}
  @starting-style{ .modal.on .card{opacity:0;transform:translateY(10px) scale(.99);} }
  .modal.on .card{transition:opacity .15s ease,transform .15s ease;}
  .modal h3{font-size:19px;margin-bottom:10px;}
  .modal p{font-size:14px;color:var(--ink-2);margin:0 0 20px;}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:60;background:var(--ink);color:#fff;border-radius:var(--r-pill);padding:11px 12px 11px 18px;font-size:14px;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease;}
  .toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  .toast button{color:#fff;font-weight:500;border:1px solid rgba(255,255,255,.3);border-radius:var(--r-pill);padding:4px 12px;font-size:13px;}
  .toast button:hover{background:rgba(255,255,255,.14);}

  /* ===== Diálogos centrados (patrón único de la app) ===== */
  .dialog{position:fixed;inset:0;z-index:31;display:none;place-items:center;padding:24px;background:rgba(31,29,26,.22);}
  .dialog.on{display:grid;}
  .dialog .panel{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-float);width:100%;max-width:520px;max-height:min(84vh,780px);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(10px) scale(.99);transition:opacity .15s ease,transform .15s ease;}
  .dialog.on .panel{opacity:1;transform:none;}
  @starting-style{ .dialog.on .panel{opacity:0;transform:translateY(10px) scale(.99);} }
  .dialog[data-size="sm"] .panel{max-width:440px;}
  .dialog[data-size="md"] .panel{max-width:560px;}
  .dialog[data-size="lg"] .panel{max-width:800px;}
  .dialog header{display:flex;align-items:center;gap:12px;padding:20px 24px 16px;border-bottom:1px solid var(--line);}
  .dialog header h2{font-size:19px;}
  .dialog .close{margin-left:auto;color:var(--ink-2);padding:6px;border-radius:var(--r-sm);display:grid;place-items:center;}
  .dialog .close:hover{background:var(--sunken);color:var(--ink);}
  .dialog .body{padding:22px 24px;overflow-y:auto;flex:1;}
  .dialog footer{padding:16px 24px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;}
  .dialog footer .sum{font-size:12.5px;color:var(--ink-3);line-height:1.35;}
  @media (prefers-reduced-motion:reduce){ .dialog .panel{transition:none;} }
  .dhead{display:flex;align-items:center;gap:13px;margin-bottom:20px;}
  .dhead .av{width:46px;height:46px;font-size:15px;}
  .dhead .nm{font-size:17px;font-weight:500;line-height:1.2;}
  .dhead .meta{font-size:13px;color:var(--ink-3);}
  .row{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .row .k{color:var(--ink-3);min-width:110px;font-size:13px;}
  .spark{display:block;width:100%;height:46px;margin-top:6px;}
  .sec{margin-top:24px;}
  .sec .f-label{font-size:12.5px;color:var(--ink-2);margin:0 0 9px;}

  .proto{position:fixed;right:20px;bottom:20px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);box-shadow:var(--shadow-float);padding:6px 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .proto span{font-size:12px;color:var(--ink-3);padding-left:6px;}
  .proto button{padding:6px 11px;border-radius:var(--r-pill);font-size:12.5px;color:var(--ink-2);}
  .proto button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary);font-weight:500;}
  .proto .sep{width:1px;height:20px;background:var(--line);}

  @media (max-width:1180px){
    .app{grid-template-columns:72px 1fr;}
    .side{padding:24px 12px;}
    .brand-text,.nav-item span,.who .txt{display:none;}
    .nav-item{justify-content:center;}
    .main{padding:24px 18px 56px;}
    .tablewrap{overflow-x:auto;}
    table{min-width:900px;}
    .kebab{opacity:1;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>

  ];
  P.forEach(function(p,i){ p.id='p'+i; });

  var ST_LABEL = { activo:'Activo', pausa:'En pausa', alta:'De alta', nuevo:'Nuevo', inactivo:'Inactivo' };
  var ST_RANK  = { activo:0, nuevo:1, pausa:2, inactivo:3, alta:4 };
  function isOff(p){ return p.st==='pausa' || p.st==='inactivo' || p.st==='alta'; }

  var FILTERS = [
    { id:'todos', lb:'Todos', fn:function(){ return true; } },
    { id:'activos', lb:'Activos', fn:function(p){ return p.st==='activo'||p.st==='nuevo'; } },
    { id:'nuevos', lb:'Nuevos', fn:function(p){ return p.st==='nuevo'; } },
    { id:'sincita', lb:'Sin próxima cita', fn:function(p){ return p.prox===null; } },
    { id:'inactivos', lb:'Inactivos', fn:function(p){ return p.st==='pausa'||p.st==='inactivo'; } },
    { id:'alta', lb:'De alta', fn:function(p){ return p.st==='alta'; } }
  ];

  var state = { role:'pro', filter:'todos', q:'', sort:'ultima', dir:'desc', visible:{}, sel:{} };
  PROS.forEach(function(p){ state.visible[p.id]=true; });

  function initials(nm){ return nm.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase(); }
  function proOf(id){ return PROS.filter(function(p){return p.id===id;})[0]; }

  function rel(d, future){
    if (d===null) return null;
    if (d===0) return 'hoy';
    var n = Math.abs(d);
    if (future) {
      if (n===1) return 'mañana';
      if (n<14) return 'en ' + n + ' días';
      if (n<60) return 'en ' + Math.round(n/7) + ' semanas';
      return 'en ' + Math.round(n/30) + ' meses';
    }
    if (n===1) return 'ayer';
    if (n<14) return 'hace ' + n + ' días';
    if (n<60) return 'hace ' + Math.round(n/7) + ' semanas';
    return 'hace ' + Math.round(n/30) + ' meses';
  }

  function scope(){
    return P.filter(function(p){
      if (state.role==='pro') return p.pro===ME;
      return state.visible[p.pro];
    });
  }

  function val(p, k){
    if (k==='nombre') return p.nm;
    if (k==='estado') return ST_RANK[p.st];
    if (k==='edad') return p.ed;
    if (k==='telefono') return p.tel.replace(/\s/g,'');
    if (k==='pro') return proOf(p.pro).nm;
    if (k==='ultima') return p.ult;
    return p.prox;
  }

  function current(){
    var f = FILTERS.filter(function(x){return x.id===state.filter;})[0];
    var q = state.q.toLowerCase();
    var list = scope().filter(f.fn).filter(function(p){
      return !q || (p.nm+' '+p.em+' '+p.tel).toLowerCase().indexOf(q)>-1;
    });
    var k = state.sort, dir = state.dir==='asc' ? 1 : -1;
    list.sort(function(a,b){
      var x=val(a,k), y=val(b,k);
      if (x===null && y===null) return 0;
      if (x===null) return 1;   /* los vacíos, siempre al final */
      if (y===null) return -1;
      var c = (typeof x==='string') ? x.localeCompare(y,'es') : (x-y);
      return c*dir;
    });
    return list;
  }

  /* ---------- Filtros ---------- */
  var chips = document.getElementById('chips');
  function buildChips(){
    chips.innerHTML='';
    FILTERS.forEach(function(f){
      var n = scope().filter(f.fn).length;
      var b=document.createElement('button');
      b.type='button'; b.className='chip';
      b.setAttribute('aria-pressed', String(state.filter===f.id));
      b.innerHTML = f.lb + (f.id==='todos' ? '' : '<span class="n">'+n+'</span>');
      b.addEventListener('click', function(){ state.filter=f.id; state.sel={}; buildChips(); render(); });
      chips.appendChild(b);
    });
  }

  var prosbar=document.getElementById('prosbar');
  PROS.forEach(function(p){
    var b=document.createElement('button');
    b.type='button'; b.className='pro-chip';
    b.setAttribute('aria-pressed','true');
    b.innerHTML='<i class="sw" style="background:'+p.color+'"></i>'+p.nm+(p.id===ME?' (tú)':'');
    b.addEventListener('click',function(){
      state.visible[p.id]=!state.visible[p.id];
      b.setAttribute('aria-pressed',String(state.visible[p.id]));
      state.sel={}; buildChips(); render();
    });
    prosbar.appendChild(b);
  });

  document.getElementById('q').addEventListener('input', function(){ state.q=this.value.trim(); render(); });

  /* ---------- Cabeceras ordenables ---------- */
  var CARET = '<svg class="caret" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
  var DEFAULT_DIR = { nombre:'asc', estado:'asc', edad:'asc', telefono:'asc', pro:'asc', ultima:'desc', proxima:'asc' };

  Array.prototype.forEach.call(document.querySelectorAll('#thead th[data-k]'), function(th){
    var label = th.textContent;
    th.innerHTML = '<button class="sortbtn" type="button">'+label+CARET+'</button>';
    th.querySelector('button').addEventListener('click', function(){
      var k = th.dataset.k;
      if (state.sort===k) state.dir = state.dir==='asc' ? 'desc' : 'asc';
      else { state.sort=k; state.dir=DEFAULT_DIR[k]; }
      render();
    });
  });

  /* ---------- Tabla ---------- */
  var tbody=document.getElementById('tbody');
  var foot=document.getElementById('foot');

  function render(){
    var list=current();
    var admin=state.role==='admin';
    Array.prototype.forEach.call(document.querySelectorAll('.proCol'), function(c){ c.hidden=!admin; });
    prosbar.hidden=!admin;
    document.getElementById('meRole').textContent = admin ? 'Administradora del centro' : 'Nutricionista';
    document.getElementById('count').textContent = admin
      ? scope().length + ' pacientes en la clínica'
      : scope().length + ' pacientes a tu cargo';

    Array.prototype.forEach.call(document.querySelectorAll('#thead th[data-k]'), function(th){
      if (th.dataset.k===state.sort) th.setAttribute('aria-sort', state.dir==='asc'?'ascending':'descending');
      else th.removeAttribute('aria-sort');
    });

    tbody.innerHTML='';
    if(!list.length){
      var tr=document.createElement('tr');
      tr.style.cursor='default';
      tr.innerHTML='<td colspan="9"><div class="empty"><h3>Ningún paciente con estos filtros</h3>'+
        '<p>Prueba a quitar el filtro o a buscar por otro término.</p>'+
        '<button class="btn-quiet" type="button" id="resetF">Ver todos los pacientes</button></div></td>';
      tbody.appendChild(tr);
      document.getElementById('resetF').addEventListener('click',function(){
        state.filter='todos'; state.q=''; document.getElementById('q').value='';
        buildChips(); render();
      });
      foot.innerHTML='';
      updateSel();
      return;
    }

    list.forEach(function(p){
      var pro=proOf(p.pro);
      var tr=document.createElement('tr');
      tr.className = (state.sel[p.id]?'sel ':'') + (isOff(p)?'off':'');

      var ultTxt = p.ult===null ? '<span class="soft">sin visitas</span>' : rel(p.ult,false);
      var proxTxt = p.prox===null ? '<span class="soft">sin agendar</span>' : rel(p.prox,true);

      tr.innerHTML =
        '<td><input type="checkbox" aria-label="Seleccionar '+p.nm+'"'+(state.sel[p.id]?' checked':'')+'></td>'+
        '<td class="who-cell"><div class="pt"><div class="av">'+initials(p.nm)+'</div>'+
          '<div><div class="nm">'+p.nm+'</div><div class="meta">'+p.em+'</div></div></div></td>'+
        '<td><span class="tag '+p.st+'">'+ST_LABEL[p.st]+'</span></td>'+
        '<td class="num">'+p.ed+' <span class="soft">años</span></td>'+
        (admin?'<td class="proCol"><span style="display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2)"><i style="width:9px;height:9px;border-radius:999px;background:'+pro.color+';display:block"></i>'+pro.nm.split(' ')[0]+'</span></td>':'')+
        '<td class="tel"><a href="tel:+34'+p.tel.replace(/\s/g,'')+'">'+p.tel+'</a></td>'+
        '<td class="num">'+ultTxt+'</td>'+
        '<td class="num">'+proxTxt+'</td>'+
        '<td class="acts"><button class="kebab" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Acciones de '+p.nm+'">'+
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>'+
        '</button></td>';

      tr.querySelector('input').addEventListener('click', function(ev){
        ev.stopPropagation();
        if(this.checked) state.sel[p.id]=true; else delete state.sel[p.id];
        tr.classList.toggle('sel', !!state.sel[p.id]);
        updateSel();
      });
      tr.querySelector('.tel a').addEventListener('click', function(ev){ ev.stopPropagation(); });
      var kb = tr.querySelector('.kebab');
      kb.addEventListener('click', function(ev){ ev.stopPropagation(); openMenu(kb, p); });
      tr.addEventListener('click', function(){ openDrawer(p); });
      tbody.appendChild(tr);
    });

    foot.innerHTML = '<span>Mostrando '+list.length+' de '+(admin?TOTAL_CLINICA:scope().length)+'</span>'+
      (admin ? '<button class="btn-quiet more" type="button">Cargar más</button>' : '');
    updateSel();
  }

  document.getElementById('chkAll').addEventListener('change', function(){
    var list=current();
    if(this.checked) list.forEach(function(p){ state.sel[p.id]=true; });
    else state.sel={};
    render();

  document.getElementById('selClear').addEventListener('click', function(){
    state.sel={}; document.getElementById('chkAll').checked=false; render();

  function selected(){ return P.filter(function(p){ return state.sel[p.id]; }); }

  function updateSel(){
    var s=selected(), n=s.length;
    document.getElementById('selbar').classList.toggle('on', n>0);
    document.getElementById('selCount').textContent = n + (n===1?' paciente seleccionado':' pacientes seleccionados');
    var allOff = n>0 && s.every(isOff);
    document.getElementById('selToggle').textContent = allOff ? 'Activar' : 'Desactivar';
  }

  document.getElementById('selToggle').addEventListener('click', function(){
    var s=selected(); if(!s.length) return;
    var allOff = s.every(isOff);
    s.forEach(function(p){ p.st = allOff ? 'activo' : 'inactivo'; });
    buildChips(); render();
    toast(s.length + (s.length===1?' paciente ':' pacientes ') + (allOff?'reactivado':'desactivado') + (s.length===1?'':'s'), null);
  });
  document.getElementById('selDelete').addEventListener('click', function(){ askDelete(selected()); });

  /* ---------- Menú de acciones por fila ---------- */
  var menu=document.getElementById('menu');
  var menuOwner=null;
  var IC = {
    ficha:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    editar:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 6.5 17.5 9.5"/></svg>',
    off:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.5 6.8a8 8 0 1 0 11 0"/></svg>',
    del:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7"/><path d="M10 11v6M14 11v6"/></svg>'
  };

  function openMenu(btn, p){
    var reopen = (menuOwner===btn && menu.classList.contains('on'));
    closeMenu();
    if (reopen) return;
    menuOwner=btn; btn.setAttribute('aria-expanded','true');
    var off = isOff(p);
    menu.innerHTML =
      '<button type="button" role="menuitem" data-a="ficha">'+IC.ficha+'Ir a ficha completa</button>'+
      '<button type="button" role="menuitem" data-a="editar">'+IC.editar+'Editar datos</button>'+
      '<button type="button" role="menuitem" data-a="toggle">'+IC.off+(off?'Activar paciente':'Desactivar paciente')+'</button>'+
      '<div class="sep"></div>'+
      '<button type="button" role="menuitem" class="danger" data-a="del">'+IC.del+'Eliminar</button>';
    menu.classList.add('on');
    var r=btn.getBoundingClientRect(), mh=menu.offsetHeight, mw=menu.offsetWidth;
    var top = r.bottom + 6 + window.scrollY;
    if (r.bottom + mh + 12 > window.innerHeight) top = r.top - mh - 6 + window.scrollY;
    menu.style.top = top+'px';
    menu.style.left = Math.max(10, r.right - mw + window.scrollX)+'px';

    Array.prototype.forEach.call(menu.querySelectorAll('button'), function(b){
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        var a=b.dataset.a;
        closeMenu();
        if (a==='ficha') { location.href = 'ficha-paciente.html'; return; }
        if (a==='del') { askDelete([p]); return; }
        if (a==='toggle') {
          p.st = isOff(p) ? 'activo' : 'inactivo';
          buildChips(); render();
          toast(p.nm + (p.st==='activo' ? ' vuelve a estar activo' : ' queda desactivado'), null);
          return;
        }
        openDrawer(p);
      });
    });
    menu.querySelector('button').focus();
  }
  function closeMenu(){
    menu.classList.remove('on');
    if (menuOwner) menuOwner.setAttribute('aria-expanded','false');
    menuOwner=null;
  }
  document.addEventListener('click', closeMenu);
  window.addEventListener('resize', closeMenu);
  window.addEventListener('scroll', closeMenu, true);

  /* ---------- Eliminar ---------- */
  var modal=document.getElementById('modal'), pending=[];
  function askDelete(list){
    if(!list.length) return;
    pending=list;
    document.getElementById('modalTitle').textContent = list.length===1 ? 'Eliminar paciente' : 'Eliminar ' + list.length + ' pacientes';
    document.getElementById('modalText').textContent = list.length===1
      ? 'Se eliminará la ficha de ' + list[0].nm + ' con su historial, mediciones y pautas. Si solo quieres dejar de trabajar con esta persona, desactívala en lugar de eliminarla.'
      : 'Se eliminarán ' + list.length + ' fichas con todo su historial, mediciones y pautas. Si solo quieres dejar de trabajar con ellas, desactívalas en lugar de eliminarlas.';
    modal.classList.add('on');
    document.getElementById('modalCancel').focus();
  }
  function closeModal(){ modal.classList.remove('on'); }
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  modal.addEventListener('click', function(e){ if(e.target===modal) closeModal(); });
  document.getElementById('modalOk').addEventListener('click', function(){
    var removed = pending.map(function(p){ return { p:p, i:P.indexOf(p) }; });
    removed.slice().reverse().forEach(function(r){ P.splice(r.i,1); delete state.sel[r.p.id]; });
    closeModal(); buildChips(); render();
    toast((removed.length===1 ? removed[0].p.nm + ' eliminado' : removed.length + ' pacientes eliminados'), function(){
      removed.forEach(function(r){ P.splice(r.i,0,r.p); });
      buildChips(); render();
    });
  });

  /* ---------- Aviso ---------- */
  var toastEl=document.getElementById('toast'), toastTimer=null, undoFn=null;
  function toast(msg, undo){
    document.getElementById('toastText').textContent=msg;
    undoFn=undo;
    document.getElementById('toastUndo').hidden = !undo;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ toastEl.classList.remove('on'); }, 6000);
  }
  document.getElementById('toastUndo').addEventListener('click', function(){
    if(undoFn) undoFn();
    toastEl.classList.remove('on');
  });

  /* ---------- Panel lateral ---------- */
  var drawer=document.getElementById('drawer');
  function openDrawer(p){
    var pro=proOf(p.pro);
    var pts=p.peso, spark='';
    if(pts.length>1){
      var mn=Math.min.apply(null,pts), mx=Math.max.apply(null,pts), rg=(mx-mn)||1;
      spark='<svg class="spark" viewBox="0 0 200 46" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="#2F5D4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="'+
        pts.map(function(v,i){ return (i/(pts.length-1)*200).toFixed(1)+','+(6+(1-(v-mn)/rg)*34).toFixed(1); }).join(' ')+'"/></svg>';
    }
    document.getElementById('drawerBody').innerHTML =
      '<div class="dhead"><div class="av">'+initials(p.nm)+'</div>'+
      '<div><div class="nm">'+p.nm+'</div><div class="meta">'+p.em+'</div></div></div>'+
      '<div class="row"><span class="k">Estado</span><span class="tag '+p.st+'">'+ST_LABEL[p.st]+'</span></div>'+
      '<div class="row"><span class="k">Edad</span><span>'+p.ed+' años</span></div>'+
      '<div class="row"><span class="k">Teléfono</span><span>'+p.tel+'</span></div>'+
      '<div class="row"><span class="k">Profesional</span><span><i style="display:inline-block;width:9px;height:9px;border-radius:999px;background:'+pro.color+';margin-right:7px"></i>'+pro.nm+'</span></div>'+
      '<div class="row"><span class="k">Pauta</span><span>'+p.pautaTxt+'</span></div>'+
      '<div class="row"><span class="k">Última visita</span><span>'+(p.ult===null?'sin visitas':rel(p.ult,false))+'</span></div>'+
      '<div class="row"><span class="k">Próxima cita</span><span>'+(p.prox===null?'sin agendar':rel(p.prox,true))+'</span></div>'+
      '<div class="row"><span class="k">Paciente desde</span><span>'+p.alta.split('-').reverse().join('/')+'</span></div>'+
      '<div class="sec"><p class="f-label">Tendencia de peso</p>'+
        (spark || '<p style="font-size:13px;color:var(--ink-3);margin:0">Aún no hay registros suficientes para dibujar una tendencia.</p>')+
      '</div>';
    focoPrevio = document.activeElement;
    drawer.classList.add('on'); drawer.setAttribute('aria-hidden','false');
    var c = drawer.querySelector('.close'); if(c) c.focus();
  }
  var focoPrevio = null;
  function closeDrawer(){
    drawer.classList.remove('on'); drawer.setAttribute('aria-hidden','true');
    if (focoPrevio && focoPrevio.focus) focoPrevio.focus();
  }
  document.getElementById('drawerClose').addEventListener('click',closeDrawer);
  drawer.addEventListener('click',function(e){ if(e.target===drawer) closeDrawer(); });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    if (menu.classList.contains('on')) { closeMenu(); return; }
    if (modal.classList.contains('on')) { closeModal(); return; }
    closeDrawer();
  });

  /* ---------- Controles del prototipo ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('.proto [data-role]'), function(b){
    b.addEventListener('click',function(){
      Array.prototype.forEach.call(document.querySelectorAll('.proto [data-role]'), function(o){ o.setAttribute('aria-pressed',String(o===b)); });
      state.role=b.dataset.role; state.sel={}; buildChips(); render();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.proto [data-set]'), function(b){
    b.addEventListener('click',function(){
      Array.prototype.forEach.call(document.querySelectorAll('.proto [data-set]'), function(o){ o.setAttribute('aria-pressed',String(o===b)); });
      document.documentElement.setAttribute('data-type',b.dataset.set);
    });
  });
  document.documentElement.setAttribute('data-type','b');

  buildChips();
  render();
})();
</script>
</body>
</html>
