<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    .pet {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: pet-breathe 4.8s ease-in-out infinite;
    }
    .eye {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: pet-blink 5.8s ease-in-out infinite;
    }
    .eye--right { animation-delay: 100ms; }
    @keyframes pet-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    @keyframes pet-blink {
      0%, 90%, 100% { transform: scaleY(1); }
      92% { transform: scaleY(0.08); }
      94% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
      98% { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pet, .eye { animation: none; }
    }
  </style>
  <g class="pet">
    <!-- Hojas geométricas -->
    <g fill="#8BA973">
      <rect x="46" y="10" width="8" height="22" rx="2" />
      <rect x="36" y="15" width="8" height="16" rx="2" transform="rotate(-40 40 23)" />
      <rect x="56" y="15" width="8" height="16" rx="2" transform="rotate(40 60 23)" />
    </g>
    <!-- Cuerpo de la zanahoria -->
    <path d="M 25 35 C 25 25, 75 25, 75 35 C 75 60, 55 90, 50 90 C 45 90, 25 60, 25 35 Z" fill="#FCAA67" />
    <!-- Ojos -->
    <rect class="eye eye--left" x="38" y="45" width="7" height="15" rx="3.5" fill="#111111" />
    <rect class="eye eye--right" x="55" y="45" width="7" height="15" rx="3.5" fill="#111111" />
  </g>
</svg>
