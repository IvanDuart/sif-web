<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    .pet {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: pet-breathe 4.2s ease-in-out infinite;
    }
    .eye {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: pet-blink 4.9s ease-in-out infinite;
    }
    .eye--right { animation-delay: 80ms; }
    @keyframes pet-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }
    @keyframes pet-blink {
      0%, 87%, 100% { transform: scaleY(1); }
      89% { transform: scaleY(0.08); }
      91% { transform: scaleY(1); }
      93% { transform: scaleY(0.08); }
      95.5% { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pet, .eye { animation: none; }
    }
  </style>
  <g class="pet">
    <!-- Cuerpo de la semilla -->
    <path d="M 50 15 C 20 45, 20 85, 50 85 C 80 85, 80 45, 50 15 Z" fill="#9E7453" />
    <!-- Ojos -->
    <rect class="eye eye--left" x="38" y="45" width="7" height="15" rx="3.5" fill="#111111" />
    <rect class="eye eye--right" x="55" y="45" width="7" height="15" rx="3.5" fill="#111111" />
  </g>
</svg>
