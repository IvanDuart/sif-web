<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    .pet {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: pet-breathe 5s ease-in-out infinite;
    }
    .eye {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: pet-blink 6.2s ease-in-out infinite;
    }
    .eye--right { animation-delay: 110ms; }
    @keyframes pet-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.025); }
    }
    @keyframes pet-blink {
      0%, 89%, 100% { transform: scaleY(1); }
      91% { transform: scaleY(0.08); }
      93% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
      97% { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pet, .eye { animation: none; }
    }
  </style>
  <g class="pet">
    <!-- Tallo -->
    <path d="M 50 30 L 45 15" stroke="#84A36B" stroke-width="4" stroke-linecap="round" />
    <!-- Hoja -->
    <path d="M 47 25 Q 65 15 65 25 Q 55 35 47 25 Z" fill="#84A36B" />
    <!-- Cuerpo de la manzana -->
    <circle cx="50" cy="55" r="30" fill="#84A36B" />
    <!-- Ojos -->
    <rect class="eye eye--left" x="38" y="50" width="7" height="15" rx="3.5" fill="#111111" />
    <rect class="eye eye--right" x="55" y="50" width="7" height="15" rx="3.5" fill="#111111" />
  </g>
</svg>
